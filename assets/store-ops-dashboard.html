/* ---------- 11. 视图：行动 ---------- */
function suggestions() {
  const c = state.focus ? compareDay(state.focus) : compare(state.a, state.b);
  if (!c) return [];
  const dr = driverRows(c);
  const rows = dr.rows;
  /* 只在「能动的」项上给建议：外卖平台/小程序 + 餐段；POS 是收银工具，不是可运营渠道 */
  const floor = Math.max(400, c.B.net * c.scale * 0.005);
  const actable = rows.filter(r => (r.dim === '餐段' || (r.dim === '渠道' && OPERABLE(r.name))) && r.dNet < -floor);
  /* 与首页待办同一套排序规则：先筛「跑输整体」的（gap<-3pp），再按金额。
     只按金额排会把「跟着大盘一起跌」的项排到第一，那是外部原因，不是能靠动作救回来的。 */
  const deep = actable.filter(r => r.gap < -0.03).sort((a, b) => a.dNet - b.dNet);
  const flat = actable.filter(r => r.gap >= -0.03).sort((a, b) => a.dNet - b.dNet);
  const pool = deep.length ? deep : actable.slice().sort((a, b) => a.dNet - b.dNet);
  const pick = (list, n) => {
    const out = [], seen = new Set();
    for (const r of list) {
      if (out.length >= n) break;
      if (seen.has(r.name)) continue;
      seen.add(r.name); out.push(r);
    }
    return out;
  };
  let out = [...pick(pool.filter(r => r.dim === '渠道'), 1), ...pick(pool.filter(r => r.dim === '餐段'), 2)]
    .sort((a, b) => a.dNet - b.dNet);
  if (out.length < 2) out = [...out, ...pick(pool.filter(r => !out.includes(r)), 2 - out.length)].sort((a, b) => a.dNet - b.dNet);

  /* 让利效率是全店层面的病：单看渠道会漏掉，而且它金额最大、最好动，排第一条 */
  const lv = leverage(c);
  const spS = discSplit(c);
  const t0 = spS.rows.filter(r => !r.comm && r.d > 0)[0];
  const t0rest = t0 ? spS.totD - t0.d : 0;
  const levItem = (lv && (lv.lv === 'warn' || lv.lv === 'bad') && lv.ratio != null) ? {
    dim: '让利', name: t0 ? t0.name : '优惠力度', nature: '让利过度',
    dNet: -(lv.dDisc - lv.dNet), amtLabel: '相当于白扔',
    adv: {
      t: t0 ? `把「${t0.name}」收紧一档，先试 3 天` : '把满减/折扣收紧一档，先试 3 天',
      d: `这期每多让 1 元优惠，只换回 ${lv.ratio.toFixed(2)} 元实收（低于 1 就是亏）。${t0 ? `多让的 ${money(t0.d)} 全在「${t0.name}」这一项（其余项合计 ${sm(t0rest)}）` : '多让的钱集中在少数几项'}——挑门槛最高、核销最少的那个档位先降一档或撤掉，看 3 天单量掉多少：掉得少说明这些单本来就会来，补贴是白给的；掉得多说明单量确实是买来的，这笔账要重算。`,
      own: '店长 + 老板'
    }
  } : null;
  const res = (levItem ? [levItem, ...out.slice(0, 2)] : out.slice(0, 3))
    .map(r => r.adv ? r : ({ ...r, nature: natureOf(r), adv: adviceFor(r.dim, r.name, natureOf(r)) }));
  /* 金额最大但没被列进来的项：一般是「跟整体一起降」的那类，页面上要说明为什么不列 */
  res.skipped = flat[0] || null;
  res.overall = dr.overall;
  res.baseDesc = c.labelB;
  const all = rows.filter(r => r.dim === '餐段' || (r.dim === '渠道' && OPERABLE(r.name)));
  res.totalCount = all.length;
  res.fallingCount = all.filter(r => r.dNet < 0).length;
  return res;
}
function ledgerEffect(x) {
  if (!x.start) return null;
  const s = cur();
  const w = 7;
  const b1 = addDays(x.start, -1), b0 = addDays(x.start, -w);
  const a0 = x.start, a1 = addDays(x.start, w - 1);
  if (b0 < M.date_min || a1 > M.date_max) return null;
  const B = agg(s.daily.filter(d => d.d >= b0 && d.d <= b1));
  const Aa = agg(s.daily.filter(d => d.d >= a0 && d.d <= a1));
  return { before: B.net, after: Aa.net, delta: Aa.net - B.net, rate: div(Aa.net - B.net, B.net), from: b0, to: a1 };
}

    : '本期没有明显下滑项，不需要硬凑动作。等有信号时再加，或手动记一条。';
  const rows = items.slice().sort((a, b) => (a.status === '已完成' ? 1 : 0) - (b.status === '已完成' ? 1 : 0)).map(x => {
    const eff = ledgerEffect(x);
    const stCls = x.status === '已完成' ? 'green' : x.status === '进行中' ? 'blue' : x.status === '已放弃' ? 'gray' : 'amber';
    return `<tr>
      <td style="max-width:280px"><div style="font-weight:500">${esc(x.title)}</div>
        ${x.note ? `<div class="hint">${esc(x.note)}</div>` : ''}</td>
      <td>${esc(x.owner || '—')}</td>
      <td class="num">${esc(x.due || '—')}</td>
      <td class="num">${x.expect != null ? money(x.expect) : '—'}</td>
      <td><span class="chip ${stCls}">${esc(x.status)}</span></td>
      <td class="num">${eff ? `<span style="color:${eff.delta >= 0 ? 'var(--pos)' : 'var(--neg)'};font-weight:600">${sm(eff.delta)}</span><div class="hint">执行后 7 天 vs 前 7 天</div>` : '<span class="hint">执行后自动算</span>'}</td>
      <td style="white-space:nowrap">
        <select data-act="status" data-id="${x.id}" style="padding:4px 6px;font-size:11.5px">
          ${['待开始', '进行中', '已完成', '已放弃'].map(s => `<option ${s === x.status ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
        <button class="btn ghost sm" style="margin-left:5px" data-act="del" data-id="${x.id}">删</button>
      </td>
    </tr>`;
  }).join('');

  return `
  ${items.length === 0 && !sug.length ? `<div class="card pad" style="margin-bottom:16px;border-left:3px solid var(--line)">
    <div style="font-size:14.5px;font-weight:600;margin-bottom:4px">本期没有该追的动作</div>
    <p style="margin:0;font-size:13px;color:var(--ink2);line-height:1.8">
      结构上没有跑输整体的项，台账空着是正常的——不硬造动作也是一种判断。
      ${targetFor().ok ? '继续按现在的做法跑，下期再比。' : '下一件事是把目标设上（日/周/月都行），系统才有基准判断「达成没达成」。'}
    </p>
  </div>` : items.length === 0 && sug.length ? `<div class="card pad" style="margin-bottom:16px;border-left:3px solid var(--brand)">
    <div style="font-size:14.5px;font-weight:600;margin-bottom:4px">台账还是空的：先加一条，才能验证做了有没有用</div>

      系统从本期归因里挑出 <b>${sug.length}</b> 条该动手的，合计涉及 <b>${money(sug.reduce((t, x) => t + Math.abs(x.dNet), 0))}</b>。
      加进台账、填截止日和执行起始日，7 天后这里会自动算出「做了之后是好是坏」——不看动作，只看数。
    </p>
  </div>` : `<div class="grid g3" style="margin-bottom:16px">
    <div class="kpi"><div class="lab">未结动作</div><div class="val">${open.length}</div><div class="sub">待开始 + 进行中</div></div>
    <div class="kpi"><div class="lab">已完成</div><div class="val">${done.length}</div><div class="sub">有执行前对比的会自动算效果</div></div>
    <div class="kpi"><div class="lab">预计可追回</div><div class="val">${money(open.reduce((t, x) => t + (Number(x.expect) || 0), 0))}</div><div class="sub">按动作登记的预期影响</div></div>
  </div>`}

  <div class="sec"><h2>系统建议的动作</h2><p>从本期归因直接生成，点「加入台账」就带全部字段</p></div>
  ${(() => {
      const sk = sug.skipped;
      if (!sk) return '';
      return `<div class="note" style="margin-bottom:12px">
        ${sug.overall < 0
          ? `本期 <b>${sug.totalCount}</b> 个可运营项里 <b>${sug.fallingCount}</b> 个在降，是<b>整体性回落</b>。
             <b>${esc(sk.name)}</b> 少卖 ${money(Math.abs(sk.dNet))}，但降幅 ${spct(sk.rate)} 和整体 ${spct(sug.overall)} 基本一致——大盘在跌，单列动作救不回来，先查外部因素（假期、天气、周边施工）。`
          : `整体这期是 ${spct(sug.overall)}，但 <b>${sug.totalCount}</b> 个可运营项里还有 <b>${sug.fallingCount}</b> 个在降。
             <b>${esc(sk.name)}</b> 少卖 ${money(Math.abs(sk.dNet))}（${spct(sk.rate)}），和整体方向相反——这类「大盘在涨、它在跌」才最该查。`}

    <div class="card pad"><div style="font-weight:600;margin-bottom:4px">要不要留</div><p class="hint">有效就固化成常规做法，无效就停，别让动作无限堆积。</p></div>
  </div>`;
}

const VIEWS = {
  home: { t: '经营', s: () => `${curName()} · ${md(state.a)}~${md(state.b)}`, f: viewHome },
  why: { t: '归因', s: () => state.focus ? `${md(state.focus)} 为什么` : '本期为什么涨/跌', f: viewWhy },

};
function renderNav() {
  const todos = buildTodos();
  const openCnt = state.ledger.filter(x => x.status !== '已完成' && x.status !== '已放弃').length;
  const items = [
    ['home', '经营', todos.length || ''],
    ['why', '归因', ''],
    ['struct', '结构', ''],
    ['action', '行动', openCnt || ''],
    ['data', '数据', '']
  ].filter(x => hasView(x[0]));
  $('nav').innerHTML = items.map(([k, label, cnt]) =>
    `<button data-view="${k}" class="${state.view === k ? 'on' : ''}">${icon(k)}<span>${label}</span>${cnt !== '' ? `<span class="cnt">${cnt}</span>` : ''}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b => b.onclick = () => { state.view = b.dataset.view; state.focus = null; render(); });
}
function renderTop() {
  const sel = $('storeSel');
  sel.innerHTML = STORE_KEYS.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('') + `<option value="__ALL__">全部门店（合计）</option>`;
  sel.value = state.store;
  sel.onchange = () => { state.store = sel.value; state.tgtCycle = null; save(); render(); };

  /* 数据跨月时先给一组「9 月 / 10 月」按钮，比手填日期快；月数太多就不给了，免得挤爆 */
  const ms = monthRanges();
  const monthChips = ms.length >= 2 && ms.length <= 6 ? ms : [];
  const allSpan = daysBetween(M.date_min, M.date_max) + 1;
  const segs = monthChips.map(m => ['m:' + m.key, m.label])
    .concat([['d7', '近 7 天'], ['d14', '近 14 天'], ['month', allSpan > 32 ? '全期' : '全月'], ['custom', '自定义']]);
  $('periodSeg').innerHTML = segs.map(([k, l]) => `<button data-period="${k}" class="${state.period === k ? 'on' : ''}">${l}</button>`).join('');
  $('periodSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
    const k = b.dataset.period;
    state.period = k;
    if (k.indexOf('m:') === 0) {
      const m = monthChips.filter(x => 'm:' + x.key === k)[0];
      if (m) { state.a = m.a; state.b = m.b; }
      state.focus = null; render(); return;
    }
    if (k === 'month') { state.a = M.date_min; state.b = M.date_max; }
    if (k === 'd14') { state.b = M.date_max; state.a = addDays(M.date_max, -13); }
    if (k === 'd7') { state.b = M.date_max; state.a = addDays(M.date_max, -6); }
    state.focus = null;
    render();
  });
  $('dateWrap').style.display = state.period === 'custom' ? 'flex' : 'none';
  $('dateA').min = M.date_min; $('dateA').max = M.date_max; $('dateB').min = M.date_min; $('dateB').max = M.date_max;
  $('dateA').value = state.a; $('dateB').value = state.b;
  $('dateA').onchange = () => { state.a = $('dateA').value; if (state.a > state.b) { state.b = state.a; } render(); };
  $('dateB').onchange = () => { state.b = $('dateB').value; if (state.b < state.a) { state.a = state.b; } render(); };
  const db = $('dataBtn'); if (db) db.onclick = () => { state.view = 'data'; render(); };
  const ib = $('importBtn'); if (ib) ib.onclick = openImport;
  const bs = $('brandSub');

/* 事件委托 */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) {
    const dv = e.target.closest('[data-view]');
    if (dv) { state.view = dv.dataset.view; state.focus = null; render(); }
    return;
  }
  const act = t.dataset.act;
  if (act === 'day') { state.focus = t.dataset.date; state.view = 'why'; render(); return; }
  if (act === 'wkGo') { state.period = 'custom'; state.a = t.dataset.a; state.b = t.dataset.b; state.focus = null; render(); return; }
  if (act === 'focusTarget') { e.preventDefault(); const i = $('targetInput'); if (i) { i.focus(); i.scrollIntoView({ block: 'center', behavior: 'smooth' }); } return; }
  if (act === 'saveTarget') {
    const v = Number(($('targetInput') || {}).value || 0);
    const cyc = state.tgtCycle || targetFor().cycle || 'month';
    setTargetFor(cyc, v > 0 ? v : 0);
    state.tgtCycle = null;
    render(); return;
  }
  if (act === 'tgtCycle') {
    const nc = t.dataset.cycle;
    const oc = state.tgtCycle || targetFor().cycle || 'month';
    const inp = $('targetInput');
    if (inp && nc !== oc) {
      /* 换周期时保留同一个真实目标，只是换个说法；日均不变，下面的折算数也就不变 */
      const v = Number(inp.value || 0);
      if (v > 0) inp.value = Math.round(v / cycleDivisor(oc) * cycleDivisor(nc));
      inp.placeholder = TG_PH[nc];
    }
    state.tgtCycle = nc;
    const seg = $('tgtSeg');
    if (seg) seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.cycle === nc));
    updateTgtPreview();
    return;
  }
  if (act === 'todoGo') {
    const todos = buildTodos();
    const t2 = todos[Number(t.dataset.i)];
    if (!t2) return;
    if (t2.go.view === 'home' && t2.go.anchor) { state.view = 'home'; render(); setTimeout(() => { const i = $('targetInput'); if (i) i.focus(); }, 80); return; }
    if (t2.go.store) { state.store = t2.go.store; save(); }
    state.view = t2.go.view || 'why';
    state.focus = t2.go.focus || null;
    if (t2.go.dim) state.dim = t2.go.dim;
    render(); return;
  }
  if (act === 'exHoliday' || act === 'toggleHol') { e.preventDefault(); state.exHoliday = !state.exHoliday; state.focus = null; render(); return; }
  if (act === 'dim') { state.dim = t.dataset.dim; render(); return; }
  if (act === 'clearFocus') { state.focus = null; render(); return; }
  if (act === 'cmpDay') {
    if (!state.focus) {
      const ds = cur().daily.filter(x => x.d >= state.a && x.d <= state.b);
      let worst = null;
      ds.forEach(x => {
        const b = weekdayBase(x.d);
        if (!b || !b.net) return;
        const dev = x.net - b.net;
        if (!worst || dev < worst.dev) worst = { d: x.d, dev };
      });
      state.focus = worst ? worst.d : ds[ds.length - 1].d;
    }
    render(); return;
  }
  if (act === 'cmpPeriod') { state.focus = null; render(); return; }
  if (act === 'switchStore') { state.store = t.dataset.store; save(); render(); return; }
  if (act === 'goStruct') { state.view = 'struct'; state.focus = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (act === 'addFromWhy' || act === 'quickAdd') {
    const list = act === 'quickAdd' ? suggestions() : null;
    const r = list ? list[Number(t.dataset.i)] : suggestions()[0];
    if (!r) return;
    state.ledger.push({
      id: String(Date.now()),
      store: state.store,
      title: r.adv.t,
      note: `${r.dim}·${r.name} ${sm(r.dNet)}｜${r.nature}`,
      owner: r.adv.own,
      due: addDays(state.b, 7),
      expect: Math.round(Math.abs(r.dNet)),
      status: '待开始',
      start: state.b
    });
    save(); state.view = 'action'; render(); return;
  }
  if (act === 'addManual') {
    const title = ($('fTitle') || {}).value || '';
    if (!title.trim()) { return; }
    state.ledger.push({
      id: String(Date.now()), store: state.store, title: title.trim(),
      owner: ($('fOwner') || {}).value || '', due: ($('fDue') || {}).value || '',
      expect: Number(($('fExpect') || {}).value || 0) || 0,
      status: '待开始', start: ($('fStart') || {}).value || '', note: ''
    });
    save(); render(); return;
  }
  if (act === 'dropFile') {
    const i = Number(t.dataset.i);
    const nm = FILES[i] ? FILES[i].name : '';
    if (confirm(`移除「${nm}」？剩下的文件会重新合并。`)) dropFile(i);
    return;
  }
  if (act === 'clearFiles') {
    if (confirm('清空全部导入的文件，回到示例数据？')) resetData();
    return;
  }
  if (act === 'del') {
    state.ledger = state.ledger.filter(x => x.id !== t.dataset.id);
    save(); render(); return;
  }
});
document.addEventListener('change', (e) => {
  const s = e.target.closest('[data-act="status"]');
  if (!s) return;
  const item = state.ledger.find(x => x.id === s.dataset.id);
  if (item) { item.status = s.value; save(); render(); }
});

/* ---------- 13.5 导入自己的数据 ---------- */
let _imp = null;      /* { items:[{name,size,r,D,err}], add, all, merged, open } */

const fmtSize = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';

function modalOpen(title, sub) {
  $('mTitle').textContent = title;
  $('mSub').textContent = sub || '';
  $('modal').classList.add('on');
}
function modalClose() { $('modal').classList.remove('on'); }

function openImport() { _imp = null; impStep1(''); }

/* ---------- 第一步：选文件（可多份） ---------- */
function impStep1(msg) {
  const have = FILES.length;
  modalOpen('导入自己的收银明细', '可一次选多份｜xlsx / csv｜列名不同也能自动认');
  $('mBody').innerHTML = `
    <div class="drop" id="drop">
      <div class="ic">⬆</div>
      <b>把收银明细表拖到这里，或点一下选文件</b>
      <div class="hint">支持一次选<b>多份</b>（Ctrl / ⌘ 多选）· xlsx / csv / txt · 单份 60MB 以内 · 一份表里可以有多家店、多个月</div>
    </div>
    <div class="note" style="margin-top:12px">多份文件会<b>合并成一份数据</b>：同一天出现在两份里，以<b>后导入的那份</b>为准；完全一样的重复导出会自动去掉，不会把营业额算两遍。</div>
    ${have ? `<div class="note" style="margin-top:10px;border-left-color:var(--warn)">当前已有 <b>${have}</b> 份导入文件，这次选的会<b>并入</b>，不替换。想清空重来，去「数据」页点「清空全部文件」。</div>` : ''}
    ${msg ? `<div class="note" style="margin-top:10px;border-left-color:var(--neg)">${esc(msg)}</div>` : ''}
    <input type="file" id="fileInput" multiple accept=".xlsx,.xlsm,.csv,.txt,.tsv" style="display:none">
    <div class="note" style="margin-top:14px">表里<b>至少要有营业日期、实收金额、门店名称</b>这三列。另外有订单号、流水金额、客流、渠道、餐段、优惠明细、支付方式的话，就能算到归因和结构那一层。</div>
    <div class="hint" style="margin-top:10px">数据只存在这台电脑的浏览器里，不上传任何服务器。换电脑、清缓存、换浏览器都要重新导入一次。</div>`;
  $('mFoot').innerHTML = `<button class="btn ghost sm" id="impCancel">取消</button>`
    + (have ? `<button class="btn ghost sm" id="impClear">清空全部文件</button>` : '');
  $('impCancel').onclick = modalClose;
  const cb = $('impClear'); if (cb) cb.onclick = resetData;

  const drop = $('drop'), fi = $('fileInput');
  drop.onclick = () => fi.click();
  fi.onchange = () => { const fs = Array.from(fi.files || []); if (fs.length) impLoad(fs); };
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hot'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hot'); }));
  drop.addEventListener('drop', e => {
    const fs = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
    if (fs.length) impLoad(fs);
  });
}

/* ---------- 读文件（逐份，带进度） ---------- */
async function impLoad(files) {
  _imp = { items: files.map(f => ({ name: f.name, size: f.size, file: f })), open: -1 };
  modalOpen('正在读取', '大表要几秒，别关窗口');
  $('mFoot').innerHTML = `<button class="btn ghost sm" id="impCancel2">取消</button>`;
  $('impCancel2').onclick = modalClose;
  for (let i = 0; i < _imp.items.length; i++) {
    const it = _imp.items[i];
    $('mBody').innerHTML = `<div style="padding:26px 0;text-align:center;font-size:13px"><span class="spin"></span>
      解析 ${i + 1}/${_imp.items.length}：${esc(it.name)}（${fmtSize(it.size)}）…</div>`;
    await new Promise(r => setTimeout(r, 20));
    try { const r = await IMP.readFile(it.file); r.fileSize = it.size; it.r = r; }
    catch (e) { it.err = (e && e.message) || '读不了这个文件'; }
  }
  await impStep2();
}

/* 兼容旧调用：单文件 */
async function impFile(file) { return impLoad([file]); }

/* ---------- 第二步：逐份汇总 + 合并预检 ---------- */
async function impStep2() {
  modalOpen('确认字段与合并结果', '先自动认了一遍；认错了点那一行的「改字段」');
  $('mFoot').innerHTML = '';
  $('mBody').innerHTML = `<div style="padding:26px 0;text-align:center;font-size:13px"><span class="spin"></span>
    正在汇总 ${_imp.items.length} 份文件…</div>`;
  await new Promise(r => setTimeout(r, 20));
  impRecalc();
  impStep2Render();
}

/* 重新汇总新文件，再与已导入的文件合并 */
function impRecalc() {
  _imp.items.forEach(it => {
    if (!it.r) return;
    if (IMP.requiredMissing(it.r.map).length) { it.D = null; return; }
    try {
      it.D = IMP.aggregate(it.r.rows, it.r.headerAt, {
        groupAt: it.r.groupAt, map: it.r.map, discCols: it.r.discCols, payCols: it.r.payCols, source: it.name
      });
    } catch (e) { it.D = null; it.err = (e && e.message) || '汇总失败'; }
  });
  _imp.add = _imp.items.filter(it => it.D).map(it => ({ name: it.name, D: it.D }));
  _imp.all = FILES.concat(_imp.add);
  _imp.merged = _imp.add.length ? MG.merge(_imp.all) : (FILES.length ? MG.merge(FILES) : null);
}

const MAP_FIELDS = [
  ['store', '门店名称', 1], ['date', '营业日期', 1], ['net', '实收金额', 1],
  ['gross', '流水金额', 0], ['disc', '优惠金额', 0], ['order', '订单编号', 0],
  ['guests', '客流量', 0], ['ch', '渠道', 0], ['meal', '餐段', 0], ['biz', '业务类型', 0],
  ['time', '结账时间', 0], ['member', '会员卡号', 0], ['phone', '电话', 0]
];

function impStep2Render() {
  const items = _imp.items;
  const add = _imp.add || [];
  const mg = _imp.merged;
  const D = mg && mg.D;
  const rep = mg && mg.report;
  const noData = items.filter(it => !it.D);

  const fileRow = (it, i) => {
    if (!it.r) return `<tr><td><b>${esc(it.name)}</b></td><td colspan="5" style="color:var(--neg)">${esc(it.err || '读不了')}</td></tr>`;
    const t = it.D ? it.D.all.total : null;
    return `<tr>
      <td><b>${esc(it.name)}</b><div class="hint">${it.r.kind} · ${fmtSize(it.size)} · 表头第 ${it.r.headerAt + 1} 行</div>
        <button class="btn ghost sm only-sm" data-open="${i}">${_imp.open === i ? '收起字段' : '改字段'}</button></td>
      <td class="r num c-hide">${it.D ? nf(it.D.meta.rows) : '—'}</td>
      <td class="r num">${t ? money(t.net) : '—'}</td>
      <td>${it.D ? `${md(it.D.meta.date_min)}~${md(it.D.meta.date_max)}<div class="hint">${it.D.meta.days} 天</div>` : '<span style="color:var(--neg)">缺必需列</span>'}</td>
      <td class="r num c-hide">${it.D ? it.D.meta.stores.length : '—'}</td>
      <td class="r c-hide-sm">${it.D ? `<button class="btn ghost sm" data-open="${i}">${_imp.open === i ? '收起' : '改字段'}</button>`
        : `<button class="btn ghost sm" data-open="${i}">去指定</button>`}</td>
    </tr>`;
  };

  const mapPanel = () => {
    const i = _imp.open, it = items[i];
    if (!it || !it.r) return '';
    const r = it.r, miss = IMP.requiredMissing(r.map);
    const opts = (sel) => `<option value="">（不用这一列）</option>` +
      r.headers.map((h, j) => `<option value="${j}" ${sel === j ? 'selected' : ''}>${esc(h || ('第 ' + (j + 1) + ' 列'))}</option>`).join('');
    return `<div style="margin-top:14px">
      <div style="display:flex;gap:8px;align-items:baseline;margin-bottom:8px;flex-wrap:wrap">
        <span style="font-size:12.5px;font-weight:600">${esc(it.name)}</span>
        <span class="hint">${miss.length ? `<span style="color:var(--neg)">还缺：${miss.join('、')}</span>` : '必需字段都接上了'}</span>
      </div>
      <div class="card scroll" style="box-shadow:none;border:1px solid var(--line);max-height:250px;overflow:auto">
        <table class="mapt"><thead><tr><th style="width:92px">要用的字段</th><th>对应这一列</th><th style="width:92px">识别</th></tr></thead><tbody>
        ${MAP_FIELDS.map(([k, label, req]) => {
      const v = r.map[k];
      return `<tr><td>${label}${req ? '<span class="req">必需</span>' : ''}</td>
            <td><select data-map="${k}" data-i="${i}">${opts(v == null ? undefined : v)}</select></td>
            <td>${v == null ? (req ? '<span style="color:var(--neg);font-size:11px">未找到</span>' : '<span class="hint">不用</span>') : '<span class="ok">已接上</span>'}</td></tr>`;
    }).join('')}
        </tbody></table>
      </div></div>`;
  };

  let mergeLine = '';
  if (rep && D) {
    const bits = [];
    if (rep.conflict) bits.push(`<b>${rep.conflict}</b> 天两份数值不一样，已按新文件覆盖（${rep.conflictDays.slice(0, 3).map(md).join('、')}${rep.conflict > 3 ? '…' : ''}）`);
    if (rep.dup) bits.push(`<b>${rep.dup}</b> 天完全重复，只算了一次`);
    if (!rep.conflict && !rep.dup) bits.push('没有日期重叠，几份数据正好拼起来');
    mergeLine = `<div class="note" style="margin-top:12px">${bits.join('；')}。合并后 <b>${D.meta.days}</b> 天（${md(D.meta.date_min)}~${md(D.meta.date_max)}），共 <b>${_imp.all.length}</b> 份文件。</div>`;
  }

  $('mBody').innerHTML = `
    ${D ? `<div class="finfo">
      <div><div class="k">本次新增</div><div class="v">${add.length} 份</div></div>
      <div><div class="k">合并后实收</div><div class="v">${money(D.all.total.net)}</div></div>
      <div><div class="k">覆盖天数</div><div class="v">${D.meta.days} 天</div></div>
      <div><div class="k">门店</div><div class="v">${D.meta.stores.length} 家</div></div>
    </div>` : `<div class="note" style="border-left-color:var(--neg)">还没有一份能用的文件，下面看哪份缺字段。</div>`}
    ${mergeLine}

    <div style="font-size:12.5px;font-weight:600;margin-top:16px;margin-bottom:7px">这次选的文件</div>
    <div class="card scroll" style="box-shadow:none;border:1px solid var(--line)">
      <table class="ftab"><thead><tr><th>文件</th><th class="r c-hide">行数</th><th class="r">实收</th><th>日期范围</th><th class="r c-hide">门店</th><th class="c-hide-sm"></th></tr></thead>
        <tbody>${items.map(fileRow).join('')}</tbody></table>
    </div>

    <div class="hint" style="margin-top:12px">金额三项对账：${D ? `流水 − 优惠 = 实收 ${pct(1 - (D.all.q.gross_net_mismatch || 0) / Math.max(1, D.meta.rows))} 行对得上 · 优惠明细合计对得上 ${pct(1 - (D.all.q.disc_detail_mismatch || 0) / Math.max(1, D.meta.rows))} · 支付明细合计对得上 ${pct(1 - (D.all.q.pay_detail_mismatch || 0) / Math.max(1, D.meta.rows))}` : '—'}</div>`;

  const canGo = add.length > 0;
  $('mFoot').innerHTML = `<button class="btn ghost sm" id="impBack">重新选文件</button>
    <button class="btn" id="impGo" ${canGo ? '' : 'disabled'}>合并导入</button>`;
  $('impBack').onclick = () => impStep1('');
  $('impGo').onclick = impApply;

  $('mBody').querySelectorAll('[data-open]').forEach(b => {
    b.onclick = () => { const i = Number(b.dataset.open); _imp.open = _imp.open === i ? -1 : i; impStep2Render(); };
  });
  $('mBody').querySelectorAll('select[data-map]').forEach(s => {
    s.onchange = () => {
      const k = s.dataset.map, i = Number(s.dataset.i), it = _imp.items[i];
      if (s.value === '') delete it.r.map[k]; else it.r.map[k] = Number(s.value);
      impRecalc();
      impStep2Render();
    };
  });
}

/* ---------- 第三步：合并导入 ---------- */
function impApply() {
  const add = (_imp && _imp.add) || [];
  if (!add.length) { impStep1('这些文件按现在的字段都对不上，没法合并'); return; }
  const all = FILES.concat(add);
  const mm = MG.merge(all);
  if (!mm || !mm.D.meta.days) { impStep1('合并后一天数据都没有，检查日期列选对没有'); return; }
  const beforeN = FILES.length;
  applyData(mm.D, all);
  render();
  impStep3(mm.report, add, beforeN);
}

function impStep3(rep, add, beforeN) {
  const D = DATA;
  const saved = !M.storageFail;
  modalOpen('导入完成', `已合并 ${FILES.length} 份文件，全站按新数据重算`);
  const rows = (rep.files || []).map(f => `<tr>
      <td>${esc(f.name)}</td>
      <td>${md(f.date_min)}~${md(f.date_max)}<div class="hint">${f.days} 天</div></td>
      <td class="r num">${money(f.net)}</td>
      <td class="r num">${pct(div(f.net, D.all.total.net))}</td></tr>`).join('');
  $('mBody').innerHTML = `
    <div class="finfo" style="margin-bottom:14px">
      <div><div class="k">合并后实收</div><div class="v">${money(D.all.total.net)}</div></div>
      <div><div class="k">单量</div><div class="v">${nf(D.all.total.orders)}</div></div>
      <div><div class="k">日期范围</div><div class="v">${md(D.meta.date_min)}~${md(D.meta.date_max)}（${D.meta.days} 天）</div></div>
      <div><div class="k">门店</div><div class="v">${D.meta.stores.length} 家</div></div>
    </div>
    <div class="card scroll" style="box-shadow:none;border:1px solid var(--line)">
      <table><thead><tr><th>文件</th><th>覆盖日期</th><th class="r">实收</th><th class="r">占合并后</th></tr></thead>
        <tbody>${rows}</tbody></table>
    </div>
    <div class="note" style="margin-top:12px">接下来先看<b>经营</b>页最上面那句话。${D.meta.days >= 60 ? '数据跨了两个月以上，区间那一行会多出「按月」按钮，可以直接比月。' : ''}${saved ? '数据已经存在本机浏览器，刷新不丢。' : '<b style="color:var(--warn)">数据太大，没能存进浏览器（刷新会丢），建议按季度拆成几份再导。</b>'}</div>
    <div class="hint" style="margin-top:10px">这次${beforeN ? `在原有 ${beforeN} 份基础上并入 ${add.length} 份` : `导入了 ${add.length} 份`}。想删掉其中一份，去「数据」页的文件清单。</div>`;
  $('mFoot').innerHTML = `<button class="btn ghost sm" id="impAgain">再导一份</button>
    <button class="btn" id="impDone">开始看</button>`;
  $('impAgain').onclick = openImport;
  $('impDone').onclick = () => { modalClose(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
}

function persist() {
  M.storageFail = false;
  try { localStorage.removeItem(OLD_KEY); } catch (e) { }
  try {
    if (FILES.length) {
      const s = JSON.stringify(FILES);
      /* localStorage 一般 5MB，留出余量；超了就让数据只在本次会话有效 */
      if (s.length > 4.2e6) throw new Error('too-big');
      localStorage.setItem(FILES_KEY, s);
    } else {
      localStorage.removeItem(FILES_KEY);
    }
  } catch (e) { M.storageFail = true; }
}

function applyData(D, files) {
  DATA = payAlias(D);
  if (files) FILES = files;
  M = D.meta;
  STORE_KEYS = Object.keys(D.stores);
  if (!D.stores[state.store]) state.store = STORE_KEYS[0];
  state.today = M.date_max;
  state.period = 'd7';
  state.b = M.date_max;
  state.a = addDays(M.date_max, -6);
  if (state.a < M.date_min) state.a = M.date_min;
  if (state.b < state.a) state.b = state.a;
  state.focus = null;
  persist();
}

/* 丢掉某一份文件：用剩下的重算；一份不剩就回示例数据 */
function dropFile(idx) {
  const rest = FILES.filter((f, i) => i !== idx);
  if (!rest.length) return resetData();
  const mm = MG.merge(rest);
  if (!mm || !mm.D.meta.days) return;
  applyData(mm.D, rest);
  render();
}

function resetData() {
  try { localStorage.removeItem(OLD_KEY); localStorage.removeItem(FILES_KEY); } catch (e) { }
  FILES = [];
  DATA = BASE_DATA;
  M = DATA.meta;
  STORE_KEYS = Object.keys(DATA.stores);
  state.store = STORE_KEYS[0];
  state.today = M.date_max;
  state.period = 'd7';
  state.b = M.date_max;
  state.a = addDays(M.date_max, -6);
  state.focus = null;
  modalClose();
  render();
}

/* ---------- 14. 启动 ---------- */
load();
$('mClose').onclick = modalClose;
$('modal').onclick = (e) => { if (e.target.id === 'modal') modalClose(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modalClose(); });
render();

</script>
</body>
</html>
