<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>门店经营助手 示例版 v2.4.3 · 构建 2026-11-07</title>
<meta name="app-version" content="v2.4.3 · 构建 2026-11-07">
<meta name="app-edition" content="demo">
<style>
:root{
  --bg:#F7F4F0; --panel:#fff; --ink:#241C17; --ink2:#6E625A; --ink3:#A2958C;
  --line:#EDE6DF; --line2:#F5EFE9;
  --brand:#E2552B; --brand-soft:#FDEEE8; --brand-deep:#B8401C;
  --pos:#1B7F63; --pos-soft:#E7F4EF; --neg:#C8453A; --neg-soft:#FBEAE7;
  --warn:#A9701A; --warn-soft:#FBF2E1;
  --side:#2A1D18; --side2:#3E2B22;
  --r:16px; --r2:12px;
  --sh:0 1px 2px rgba(60,40,25,.05), 0 8px 24px -12px rgba(60,40,25,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:14px;line-height:1.6;display:flex;min-height:100vh}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 9px;outline:none;min-width:0;max-width:100%}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2);font-size:13px}
th{color:var(--ink3);font-weight:500;font-size:12px;white-space:nowrap}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FCFAF8}

/* ---------- sidebar ---------- */
.side{width:196px;flex:0 0 196px;background:var(--side);color:#EBDDD3;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px 16px;z-index:40}
.brand{padding:0 10px 18px}
.brand b{display:block;font-size:16px;font-weight:600;letter-spacing:.5px;color:#fff}
.brand span{display:block;font-size:11px;color:#9C8578;margin-top:4px}
nav{display:flex;flex-direction:column;gap:3px;flex:1}
nav button{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;font-size:13.5px;color:#C6B3A7;transition:.15s;text-align:left;width:100%}
nav button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85;flex:0 0 17px}
nav button:hover{background:rgba(255,255,255,.06);color:#F3E6DC}
nav button.on{background:var(--brand);color:#fff;box-shadow:0 6px 16px -8px rgba(226,85,43,.9)}
nav button.on svg{opacity:1}
nav button .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.16);border-radius:20px;padding:1px 7px;font-variant-numeric:tabular-nums}
nav button.on .cnt{background:rgba(0,0,0,.18)}
.side-foot{margin-top:12px;padding:12px 11px 0;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#8B7568;line-height:1.7}
.side-foot b{color:#C9B4A6;font-weight:500}

/* ---------- main ---------- */
main{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:30;background:rgba(247,244,240,.92);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
.top .sub{font-size:12px;color:var(--ink3);margin-left:2px}
.sp{flex:1}
.seg{display:flex;background:#EFE9E3;border-radius:10px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border-radius:7px;font-size:12.5px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(60,40,25,.12);font-weight:500}
.content{padding:20px 26px 90px;max-width:1860px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.grid{display:grid;gap:14px}
.grid > *{min-width:0}
.g2{grid-template-columns:1fr 1fr}
.g2.wa{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.g2.wb{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.sec{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sec h2{font-size:14px;margin:0;font-weight:600;letter-spacing:.2px}
.sec p{margin:0;font-size:12px;color:var(--ink3)}
.mt{margin-top:14px}

/* ---------- hero ---------- */
.hero{background:radial-gradient(120% 140% at 0% 0%,#452B1F 0%,#2A1D18 55%,#241A15 100%);border-radius:20px;padding:24px 26px;color:#fff;display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.12fr);gap:26px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-90px;width:280px;height:280px;background:radial-gradient(circle,rgba(226,85,43,.34),transparent 68%);pointer-events:none}
.hero .kicker{font-size:11.5px;color:#B39C8D;letter-spacing:.6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero .big{font-size:44px;font-weight:600;letter-spacing:-1px;line-height:1.1;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:15px;font-weight:400;color:#C2AC9D;letter-spacing:0;margin-left:8px}
.hero .facts{display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px;color:#C6B2A3}
.hero .facts b{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.verdict{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:16px 17px;position:relative;z-index:1;display:flex;flex-direction:column;gap:9px}
.verdict .tagrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vtag{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500}
.vtag.bad{background:rgba(226,85,43,.2);color:#FFB49B;border:1px solid rgba(226,85,43,.35)}
.vtag.good{background:rgba(45,160,120,.18);color:#8FE0C2;border:1px solid rgba(45,160,120,.35)}
.vtag.flat{background:rgba(255,255,255,.12);color:#D5C3B6;border:1px solid rgba(255,255,255,.16)}
.verdict p{margin:0;font-size:13px;color:#E4D4C8;line-height:1.75}
.verdict p b{color:#fff;font-weight:600}
.verdict .why{font-size:12px;color:#A89180;border-top:1px dashed rgba(255,255,255,.13);padding-top:9px;margin-top:1px}
.verdict .why b{color:#D9C6B7}
.verdict .goalset{font-size:11.5px;color:#A89180;border-top:1px dashed rgba(255,255,255,.13);padding-top:8px;margin-top:8px}
.verdict .goalset a{color:#FFB49B;text-decoration:none;white-space:nowrap}
.verdict .goalset a:hover{text-decoration:underline}
.verdict .holnote{font-size:11.5px;line-height:1.7;color:#B8A191;background:rgba(255,255,255,.05);border-left:2px solid rgba(255,180,155,.55);border-radius:0 8px 8px 0;padding:8px 10px}
.verdict .holnote b{color:#F0DCCE;font-weight:600}
.verdict .holnote a{color:#FFB49B;text-decoration:none;white-space:nowrap}
.verdict .holnote a:hover{text-decoration:underline}

/* ---------- kpi ---------- */
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:13px 15px;box-shadow:var(--sh);position:relative;overflow:hidden;min-width:0}
.kpi .lab{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:5px}
.kpi .val{font-size:22px;font-weight:600;letter-spacing:-.4px;margin:3px 0 1px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:2px}
.dlt{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.dlt.up{color:var(--pos)} .dlt.dn{color:var(--neg)} .dlt.na{color:var(--ink3);font-weight:400}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:11px}
.cal .wd{color:var(--ink3);text-align:center;padding-bottom:2px;font-size:10.5px}
.cal .cell{border-radius:8px;padding:6px 6px 5px;min-height:52px;border:1px solid transparent;cursor:pointer;transition:.12s;position:relative}
.cal .cell:hover{transform:translateY(-1px);border-color:var(--brand);box-shadow:0 4px 12px -6px rgba(226,85,43,.55)}
.cal .cell .d{font-size:10.5px;opacity:.62;font-variant-numeric:tabular-nums}
.cal .cell .v{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.cal .cell.holv{background:repeating-linear-gradient(135deg,#EFE8E0 0 6px,#F7F1EA 6px 12px)!important;border:1px dashed #D3C4B5;color:#7A6C5F!important}
.cal .cell .hb{position:absolute;top:3px;right:4px;font-size:9px;line-height:1;padding:1px 3px;border-radius:3px;background:#E4D6C8;color:#7A6C5F;font-style:normal}
.cal .empty{border:0;cursor:default}
.cal .empty:hover{transform:none;box-shadow:none;border:0}
.cal-legend{display:flex;gap:12px;align-items:center;font-size:11px;color:var(--ink3);margin-top:11px;flex-wrap:wrap}
.lgdot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* ---------- todo rows ---------- */
.todo{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.todo:last-child{border-bottom:0}
.todo .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 30px}
.todo .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.todo .body{flex:1;min-width:0}
.todo .t{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.todo .m{font-size:11.5px;color:var(--ink3);margin-top:1px}
.todo .amt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{font-size:10.5px;padding:1px 7px;border-radius:20px;font-weight:500;white-space:nowrap}
.chip.red{background:var(--neg-soft);color:var(--neg)}
.chip.green{background:var(--pos-soft);color:var(--pos)}
.chip.amber{background:var(--warn-soft);color:var(--warn)}
.chip.gray{background:#F2EEE9;color:var(--ink2)}
.chip.blue{background:#EAF0FB;color:#3560A8}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:500;background:var(--brand);color:#fff;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--brand-deep)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- attribution bars ---------- */
.arow{display:grid;grid-template-columns:96px minmax(0,1fr) 92px;gap:10px;align-items:center;padding:5px 0}
.arow .nm{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .amt{font-size:12.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.track{position:relative;height:20px;background:#F6F1EC;border-radius:5px;overflow:hidden}
.track:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#E2D8CE}
.fill{position:absolute;top:3px;bottom:3px;border-radius:4px;min-width:2px}
.fill.pos{background:#4FA98D}
.fill.neg{background:#D9705F}
.split{display:flex;gap:0;margin-top:6px}
.split div{flex:1;padding:10px 12px;border-right:1px solid var(--line2)}
.split div:last-child{border-right:0}

/* ---------- misc ---------- */
.note{font-size:12px;color:var(--ink2);background:#FBF8F4;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;padding:10px 13px;line-height:1.7}
.note b{color:var(--ink)}
.hint{font-size:11.5px;color:var(--ink3);margin:0}
.bar-h{height:7px;background:#F3EDE7;border-radius:20px;overflow:hidden;position:relative}
.bar-h i{display:block;height:100%;border-radius:20px;background:var(--brand)}
.tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:#7A6A5E;border-radius:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.scroll{overflow-x:auto}
.scroll table{min-width:640px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:12.5px;border-bottom:1px dashed var(--line2)}
.kv:last-child{border:0}
.kv span{color:var(--ink2)} .kv b{font-weight:600;font-variant-numeric:tabular-nums}
.empty-state{padding:34px 20px;text-align:center;color:var(--ink3);font-size:12.5px}
.steps{display:flex;gap:0;margin:14px 0 4px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.steps div{flex:1;padding:9px 10px;font-size:11.5px;color:var(--ink2);background:#FCFAF8;border-right:1px solid var(--line);position:relative}
.steps div:last-child{border-right:0}
.steps b{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.steps div.on{background:var(--brand-soft);color:var(--brand-deep)}
.steps div.on b{color:var(--brand)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* 基础版只有对账体检一张卡（占满整行），6 条检查项要分栏，才不会一行横跨 800+ px */
@media(min-width:1200px){
  .checklist{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
}

/* 宽屏（≥1600）：内容铺开，但每块都别拉成一条——文字行长、日历格、KPI 都有上限，
   否则「填满」只是把空旷从右侧挪到卡片内部。 */
@media(min-width:1600px){
  .top{padding:12px 34px}
  .content{padding:22px 34px 96px}
  .hero{grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:34px;padding:26px 30px}
  .hero .big{font-size:50px}
  .hero .facts{gap:26px}
  .pad{padding:20px 22px}
  .sec{margin:30px 0 13px}
  /* 日历铺满整行：格子宽度大一点反而好读，不用缩窄居中留两边白 */
  .cal{gap:8px}
  .cal .cell{min-height:68px}
  /* 三张小结卡在宽屏下按内容排，不必均分到 600px */
  .g3{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  /* 表格类面板给足宽度，省得列被挤成两行 */
  .card.scroll{overflow-x:auto}
  /* 卡片铺开了，里面的东西不能跟着散：文字给行长上限，结论标签仍旧贴右 */
  .verdict p{max-width:none}
  .lev{grid-template-columns:132px 92px minmax(0,820px) auto;gap:22px;justify-content:space-between}
  .kpi .val{font-size:25px}
  .todo .m{max-width:900px}
  .wkstrip{gap:14px}
  .wk{padding:14px 16px}
  .wk .wkn{font-size:19px}
  #targetInput{max-width:300px}
  /* 8 条缺口项排两列，省得一张卡拖到 900 高还只写半行字 */
  .misslist{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
  /* 6 条检查项在宽屏下排三列，行跨度才不至于 800+ px */
  .checklist{grid-template-columns:repeat(3,minmax(0,1fr));gap:0 28px}
  .card .note{max-width:1180px}
  /* 四个数字指标不必各占 450px */
  .srcstats{max-width:1240px}
}

@media(max-width:1080px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .hero{grid-template-columns:1fr}
}
@media(max-width:860px){
  body{display:block;overflow-x:hidden}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex:0 0 auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0;box-shadow:0 -6px 24px -10px rgba(40,25,15,.5)}
  .brand,.side-foot{display:none}
  nav{flex-direction:row;justify-content:space-between;gap:0;flex:1}
  nav button{flex-direction:column;gap:3px;padding:6px 2px;font-size:10px;text-align:center;border-radius:9px;flex:1;justify-content:center}
  nav button svg{width:18px;height:18px;flex:0 0 18px}
  nav button .cnt{display:none}
  .top{padding:10px 14px;gap:8px}
  .top h1{font-size:15px}
  #dataBtn{display:none}
  .content{padding:14px 14px 92px}
  .g2,.g3{grid-template-columns:1fr}
  .g2.wa,.g2.wb{grid-template-columns:1fr}
  .hero{padding:18px 16px;gap:16px;border-radius:16px}
  .hero .big{font-size:34px}
  .hero .facts{gap:14px;font-size:12px}
  .cal{grid-template-columns:repeat(7,1fr);gap:3px}
  .cal .cell{min-height:44px;padding:4px 3px}
  .cal .cell .v{font-size:10px}
  .arow{grid-template-columns:70px minmax(0,1fr) 74px;gap:7px}
  .pad{padding:14px}
  .todo{padding:11px 13px;gap:9px}
  .todo .body{min-width:0}
  .todo .btn{padding:5px 9px;font-size:11.5px}
  .scroll{-webkit-overflow-scrolling:touch}
}

/* ---- 让利杠杆 ---- */
.lev{display:grid;grid-template-columns:132px 92px minmax(0,1fr) auto;gap:18px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line2);
  border-radius:14px;padding:14px 18px;margin-top:16px;box-shadow:var(--sh)}
.lev.lv-good{border-left-color:var(--pos)}
.lev.lv-warn{border-left-color:var(--warn)}
.lev.lv-bad{border-left-color:var(--neg)}
.lev.lv-flat{border-left-color:#B9A79A}
.lev .lefk{display:flex;flex-direction:column;gap:3px}
.lev .lefk .lab{font-size:13px;font-weight:600;color:var(--ink)}
.lev .lefk .q{font-size:11px;color:var(--ink3)}
.lev .lefn{font-size:29px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.lev .lefn small{font-size:12px;font-weight:500;color:var(--ink3);margin-left:2px}
.lev.lv-good .lefn{color:var(--pos)}
.lev.lv-warn .lefn{color:var(--warn)}
.lev.lv-bad .lefn{color:var(--neg)}
.lev .lefd .t{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.5}
.lev .lefd .t b{font-weight:700}
.lev .lefd .s{font-size:11.5px;color:var(--ink3);margin-top:4px;line-height:1.6}
.lev .lefd .s b{color:var(--ink2);font-weight:600}
/* ---- 近 4 周走势 ---- */
.wkstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.wk{border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;background:#fff;transition:.15s;min-width:0}
.wk:hover{border-color:#DFD2C6;background:#FDFBF9}
.wk.on{border-color:var(--brand);background:#FFF8F5;box-shadow:0 0 0 1px rgba(226,85,43,.15) inset}
.wk.hol{background:#FAF6F2}
.wk .wkd{font-size:10.5px;color:var(--ink3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wk .wkn{font-size:17px;font-weight:600;margin:5px 0 3px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.wk .wkr{font-size:11.5px;font-weight:500}
.wk .now{font-size:9px;background:var(--brand);color:#fff;border-radius:3px;padding:1px 4px;font-weight:500}
@media(max-width:900px){
  .lev{grid-template-columns:minmax(0,1fr) auto;gap:10px 14px}
  .lev .lefn{text-align:right}
  .lev .lefd{grid-column:1/-1}
  .lev .lefb{grid-column:1/-1;display:none}
  .wkstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
}


/* ---- 流水去向 ---- */
.flowbox{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.fl{display:grid;grid-template-columns:74px minmax(0,1fr) 112px 46px;gap:10px;align-items:center}
.fl.ind .flk{padding-left:14px;position:relative}
.fl.ind .flk::before{content:'';position:absolute;left:4px;top:50%;width:6px;height:1px;background:#DED0C4}
.fl .flk{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.fl.strong .flk{font-weight:600;color:var(--ink)}
.fl .flb{height:9px;background:#F4EEE8;border-radius:5px;overflow:hidden}
.fl .flb i{display:block;height:100%;border-radius:5px;transition:width .4s}
.fl .flv{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fl .flv .w{font-size:11px;font-weight:400;color:var(--ink3);margin-right:4px}
.fl.strong .flv{font-size:14px}
.fl .flp{font-size:11px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}

/* ---- 优惠明细 ---- */
.dhead,.drow{display:grid;grid-template-columns:158px minmax(0,1fr) 98px 54px;gap:12px;align-items:center}
.dhead{font-size:10.5px;color:var(--ink3);padding-bottom:7px;border-bottom:1px solid var(--line2);margin-bottom:4px}
.dhead .dc{text-align:center}
.dhead .dr,.dhead .dpr{text-align:right}
.dlist{display:flex;flex-direction:column}
.drow{padding:7px 0;border-radius:6px}
.drow:hover{background:#FDFAF8}
.dn{font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:5px;min-width:0}
.dn .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.drow.cm .dn{color:var(--ink2)}
.dtag{font-size:9.5px;line-height:1.6;padding:0 5px;border-radius:3px;background:#E9DFD6;color:#7A6D63;font-weight:500;flex:none}
.dtag.own{background:#FBE0D6;color:#AA3E28}
.dbar{display:grid;grid-template-columns:1fr 1fr;height:10px;background:#F7F2ED;border-radius:5px;overflow:hidden}
.dbar .l{display:flex;justify-content:flex-end;border-right:1px solid #E2D6C9}
.dbar .r{display:flex;justify-content:flex-start}
.dbar i{display:block;height:100%;transition:width .45s ease}
.dbar .l i{border-radius:4px 0 0 4px}
.dbar .r i{border-radius:0 4px 4px 0}
.dv{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dp{font-size:11px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dlead{margin:14px 0 0;font-size:13px;color:var(--ink2);line-height:1.85;padding-top:12px;border-top:1px dashed var(--line2)}
.dlead b{color:var(--ink);font-weight:600}
.dsplit{display:flex;gap:18px;align-items:center;margin-top:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3)}
.dsplit .dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.dsplit b{margin-left:6px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dsplit .sp{flex:1;min-width:0}
@media(max-width:640px){
  .dhead,.drow{grid-template-columns:minmax(0,1fr) 84px;gap:8px}
  .dhead .dc,.dbar{display:none}
  .dhead .dpr,.dp{display:none}
  .dsplit{gap:10px}
  .dsplit .sp{display:none}
}


@media(max-width:700px){
  /* 手机下表格不压列宽，改成横向滑动＋首列固定，否则店名长一点就会被折成四行 */
  .card.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .card.scroll table{min-width:660px}
  .card.scroll table th:first-child,.card.scroll table td:first-child{
    position:sticky;left:0;background:var(--panel);z-index:1;white-space:nowrap;
    box-shadow:6px 0 8px -6px rgba(120,90,70,.22)}
  .card.scroll table th:first-child{background:var(--panel)}
}

@media(max-width:560px){
  .card.scroll table.ftab{min-width:0}
  .ftab .c-hide,.ftab .c-hide-sm{display:none}
  .ftab .only-sm{display:inline-block;margin-top:6px}

  .fl{grid-template-columns:64px minmax(0,1fr) 74px;gap:8px}
  .fl .flp{display:none}
}

@media(max-width:560px){
  .top{flex-direction:column;align-items:stretch;gap:8px}
  .top .sp{display:none}
  .top .sub{display:none}
  .top select{width:100%}
  .seg{width:100%}
  .seg button{flex:1;text-align:center;padding:6px 2px;font-size:12px}
  .g4{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi{padding:11px 12px}
  .kpi .val{font-size:19px;letter-spacing:-.3px}
  .kpi .sub{font-size:10.5px;gap:4px}
  .sec{flex-direction:column;align-items:flex-start;gap:3px;margin:22px 0 10px}
  .sec h2{white-space:nowrap}
  .chartscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
  .chartscroll svg{min-width:600px}
  .hero .big{font-size:31px}
  .todo{flex-wrap:wrap;row-gap:6px}
  .todo .body{flex:1 1 calc(100% - 46px)}
  .todo .amt{margin-left:39px}
  .todo .btn{margin-left:auto}
  .form4{grid-template-columns:1fr 1fr !important}
  #importBtn .btxt{display:none}
  #importBtn{padding:6px 8px}
}

/* ---------- 导入弹层 ---------- */
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(28,25,22,.42);backdrop-filter:blur(2px)}
.modal.on{display:flex}
.sheet{background:var(--panel);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.24);width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.sheet-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-size:15px;font-weight:600}
.sheet-h p{margin:3px 0 0;font-size:12px;color:var(--ink3)}
.sheet-b{padding:18px 20px;overflow:auto;flex:1}
.sheet-f{display:flex;gap:9px;justify-content:flex-end;padding:13px 20px;border-top:1px solid var(--line);background:#FCFAF7;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line);border-radius:13px;padding:26px 18px;text-align:center;background:#FCFAF7;transition:.16s;cursor:pointer}
.drop:hover,.drop.hot{border-color:var(--brand);background:var(--brand-soft)}
.drop .ic{font-size:26px;line-height:1;margin-bottom:8px}
.drop b{font-size:13.5px}
.drop .hint{margin-top:5px}
.finfo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:#FCFAF7;border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:14px}
.finfo .k{font-size:11px;color:var(--ink3)}
.finfo .v{font-size:14px;font-weight:600;margin-top:2px;line-height:1.35;overflow:hidden;max-height:2.8em;word-break:break-all}
.mapt{width:100%;border-collapse:collapse;font-size:12.5px}
.mapt th{text-align:left;font-weight:600;color:var(--ink3);font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
.mapt td{padding:5px 8px;border-bottom:1px dashed var(--line2)}
.mapt select{width:100%;max-width:230px;font-size:12px;padding:5px 7px}
.mapt .req{color:var(--neg);font-size:10.5px;margin-left:4px}
.mapt .ok{color:var(--pos);font-size:11px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line2);font-size:12.5px}
.chk .t{flex:1}
.chk .r{font-weight:600;white-space:nowrap;font-size:11.5px}
.chk.bad .r{color:var(--neg)}
.chk.good .r{color:var(--pos)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--brand);border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:640px){
  .modal{padding:0;align-items:flex-end}
  .sheet{width:100%;max-height:92vh;border-radius:16px 16px 0 0}
  .finfo{grid-template-columns:1fr 1fr}
  .sheet-f{justify-content:stretch}
  .sheet-f .btn{flex:1}
  .mapt select{max-width:none}
}
@media(max-width:560px){
  .mapt thead{display:none}
  .mapt,.mapt tbody{display:block;min-width:0 !important;width:100%}
  .mapt tr{display:block;padding:9px 11px;border-bottom:1px solid var(--line2)}
  .mapt td{display:block;border:0;padding:0}
  .mapt td:first-child{font-size:12px;font-weight:600;margin-bottom:5px}
  .mapt td:last-child{margin-top:4px;font-size:11px}
  .mapt select{width:100%;max-width:none}
}
.only-sm{display:none}
</style>

      const name = new TextDecoder('utf-8').decode(b.subarray(p + 46, p + 46 + fnLen));
      if (u32(b, lho) === 0x04034b50) {
        const lfn = u16(b, lho + 26), lex = u16(b, lho + 28);
        const start = lho + 30 + lfn + lex;
        const raw = b.subarray(start, start + csize);
        if (method === 0) out.set(name, raw);
        else if (method === 8) out.set(name, await inflateRaw(raw));
      }
      p += 46 + fnLen + exLen + cmLen;
    }
    return out;
  }

  /* ---------- xml ---------- */
  const unent = (s) => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'").replace(/&#(\d+);/g, (_, d) => String.fromCharCode(+d)).replace(/&amp;/g, '&');

  function parseShared(xml) {
    const out = [];
    const re = /<si\b[^>]*>([\s\S]*?)<\/si>/g;
    let m;
    while ((m = re.exec(xml))) {
      let s = '', tr = /<t\b[^>]*>([\s\S]*?)<\/t>/g, t;
      while ((t = tr.exec(m[1]))) s += t[1];
      out.push(unent(s));
    }
    return out;
  }

  function colIdx(ref) {
    let n = 0;
    for (let i = 0; i < ref.length; i++) {
      const c = ref.charCodeAt(i);
      if (c < 65 || c > 90) break;
      n = n * 26 + c - 64;
    }
    return n - 1;
  }

  /* 流式扫行：不建 DOM，45MB 的 sheet 也能扛 */
  function parseSheet(xml, ss) {
    const rows = [];
    const rowRe = /<row\b([^>]*)>([\s\S]*?)<\/row>/g;
    const cRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    const vRe = /<v>([\s\S]*?)<\/v>/;
    const isRe = /<t\b[^>]*>([\s\S]*?)<\/t>/g;
    let rm;
    while ((rm = rowRe.exec(xml))) {
      const rAttr = /r="(\d+)"/.exec(rm[1]);
      const cells = {};
      let maxc = -1;
      cRe.lastIndex = 0;
      let cm;
      while ((cm = cRe.exec(rm[2]))) {
        const at = cm[1], inner = cm[2] || '';
        const ref = /r="([A-Z]+\d+)"/.exec(at);
        if (!ref) continue;
        const ci = colIdx(ref[1]);
        if (ci > 200) continue;
        const t = /t="([^"]+)"/.exec(at);
        let val = '';
        if (t && t[1] === 's') {
          const v = vRe.exec(inner);
          val = v ? (ss[+v[1]] || '') : '';
        } else if (t && t[1] === 'inlineStr') {
          isRe.lastIndex = 0;
          let im, s = '';
          while ((im = isRe.exec(inner))) s += im[1];
          val = unent(s);
        } else {
          const v = vRe.exec(inner);
          val = v ? unent(v[1]) : '';
        }
        if (val !== '') { cells[ci] = val; if (ci > maxc) maxc = ci; }
      }
      const arr = new Array(maxc + 1);
      for (let i = 0; i <= maxc; i++) arr[i] = cells[i] === undefined ? '' : cells[i];
      rows.push({ r: rAttr ? +rAttr[1] : rows.length + 1, v: arr });
    }
    return rows;
  }

  async function readXlsx(buf) {
    const files = await unzip(buf);
    const get = (n) => {
      const u = files.get(n);
      return u ? new TextDecoder('utf-8').decode(u) : null;
    };
    const ssXml = get('xl/sharedStrings.xml');
    const ss = ssXml ? parseShared(ssXml) : [];
    /* 第一个 worksheet */
    let sheet = get('xl/worksheets/sheet1.xml');
    if (!sheet) {
      for (const k of files.keys()) {
        if (/^xl\/worksheets\/[^/]+\.xml$/.test(k)) { sheet = get(k); break; }
      }
    }
    if (!sheet) throw new Error('xlsx 里找不到工作表');
    return parseSheet(sheet, ss);
  }

  /* ---------- csv ---------- */
  function parseCsvText(text) {
    const rows = [];
    let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',' || c === '\t' || c === ';') { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push({ r: rows.length + 1, v: row }); row = []; cell = ''; }
      else if (c === '\r') { }
      else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push({ r: rows.length + 1, v: row }); }
    return rows;
  }
  function decodeText(buf) {
    const u8 = new Uint8Array(buf);
    /* BOM */
    if (u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return new TextDecoder('utf-8').decode(u8.subarray(3));
    try {
      return new TextDecoder('utf-8', { fatal: true }).decode(u8);
    } catch (e) {
      try { return new TextDecoder('gbk').decode(u8); } catch (e2) { return new TextDecoder('utf-8').decode(u8); }
    }
  }

  /* ---------- 表头与列映射 ---------- */
  const FIELD_ALIAS = {
    store: ['门店名称', '门店', '店铺', '店名', '门店名', '组织'],
    code: ['门店编码', '门店编号', '编码', '店铺编码'],
    date: ['营业日期', '日期', '业务日期', '账单日期', '日'],
    time: ['结账时间', '交易时间', '下单时间', '时间', '支付时间'],
    order: ['订单编号', '订单号', '单号', '流水号', '账单号', '订单id'],
    direction: ['订单类型', '方向', '类型', '收付'],
    status: ['订单状态', '状态'],
    refund_flag: ['退单标识', '退单', '是否退单', '退款标识'],
    gross: ['流水金额', '应收金额', '应收', '原价', '订单金额', '消费金额'],
    disc: ['优惠金额', '优惠', '折扣金额', '减免'],
    net: ['实收金额', '实收', '实付金额', '实付', '净额', '收入'],
    guests: ['客流量', '人数', '就餐人数', '客流', '客数'],
    post_avg: ['折后人均', '客单价', '单均', '人均消费'],
    subsidy: ['补贴', '平台补贴', '商家补贴'],
    pkg: ['打包费收入', '打包费', '餐盒费'],
    goods: ['商品收入', '商品金额', '菜品金额'],
    member: ['会员卡号', '会员卡', '会员号'],
    phone: ['电话', '手机号', '手机', '联系电话', '顾客电话'],
    ch: ['订单渠道', '渠道', '来源'],
    meal: ['餐段', '时段', '市别'],
    biz: ['业务类型', '业务', '订单业务']
  };
  const DISC_HINT = /佣金|服务费|优惠|抹零|赠送|抵扣|减免|折扣/;
  const PAY_HINT = /现金|微信|支付宝|云闪付|储值|一卡通|扫码|券|外卖|闪购|补录|刷卡|银行卡|抖音|美团|饿了么/;

  function normHead(s) {
    return String(s || '').replace(/\s|\(|\)|（|）|\/|：|:/g, '').toLowerCase();
  }

  function detectHeader(rows, probe) {
    let best = -1, bestScore = 0;
    const lim = Math.min(rows.length, 12);
    for (let i = 0; i < lim; i++) {
      const cells = rows[i].v || [];
      let score = 0;
      cells.forEach(c => {
        const n = normHead(c);
        if (!n || n.length > 20) return;
        for (const k in FIELD_ALIAS) {
          if (FIELD_ALIAS[k].some(a => n === normHead(a) || n.indexOf(normHead(a)) >= 0)) { score++; break; }
        }
        if (probe && probe(n)) score += 0.5;
      });
      if (score > bestScore) { bestScore = score; best = i; }
    }
    return bestScore >= 3 ? best : -1;
  }

  /* 分组表头识别：POS 导出常是「分组行 + 细分行」两层。
     分组行会把「实收组成」重复 12 次，光看列名分不清哪个是优惠、哪个是支付，
     所以先按下移规则找到细分行，再把上一行留作 group 前缀。 */
  function pickHeader(rows, probe) {
    let h = detectHeader(rows, probe);
    if (h < 0) return { headerAt: -1, groupAt: -1 };
    let groupAt = -1;
    for (let step = 0; step < 2; step++) {
      const cur = (rows[h].v || []);
      const names = cur.filter(x => String(x || '').trim());
      if (!names.length) break;
      const seen = {}, dup = names.filter(n => { const k = normHead(n); seen[k] = (seen[k] || 0) + 1; return seen[k] > 1; }).length;
      const rate = dup / names.length;
      const nx = rows[h + 1] && rows[h + 1].v ? rows[h + 1].v : null;
      if (rate < 0.15 || !nx) break;
      /* 下一行必须在当前非空列上基本都有值，才算细分表头 */
      let filled = 0, filledN = 0;
      cur.forEach((c, i) => { if (String(c || '').trim()) { filledN++; if (String(nx[i] || '').trim()) filled++; } });
      if (!filledN || filled / filledN < 0.85) break;
      groupAt = h;
      h = h + 1;
    }
    return { headerAt: h, groupAt: groupAt };
  }

  function guessMap(headers, groups) {
    const used = new Set();
    const map = {};
    const key = Object.keys(FIELD_ALIAS);
    /* 两轮：先精确，再包含 */
    [true, false].forEach(exact => {
      key.forEach(k => {
        if (map[k] != null) return;
        const aliases = FIELD_ALIAS[k].map(normHead);
        for (let i = 0; i < headers.length; i++) {
          if (used.has(i)) continue;
          const n = normHead(headers[i]);
          if (!n) continue;
          const hit = exact ? aliases.indexOf(n) >= 0 : aliases.some(a => n.indexOf(a) >= 0);
          if (hit) { map[k] = i; used.add(i); break; }
        }
      });
    });
    /* 优惠组成列 / 支付组成列。
       有分组表头时以分组名为准（"实收组成" 下是支付方式，"……优惠组成" 下是让利项），
       没有分组才退回关键词判断——否则「系统优惠券」这种同名两列会串位。 */
    const discCols = [], payCols = [];
    headers.forEach((h, i) => {
      if (used.has(i)) return;
      const n = String(h || '');
      if (!n || n.length > 16) return;
      if (/率|比例|次数|订单数/.test(n)) return;
      const g = groups ? String(groups[i] || '') : '';
      if (g) {
        if (/实收组成|支付组成/.test(g)) { payCols.push(i); return; }
        if (/优惠组成|优惠/.test(g)) { discCols.push(i); return; }
        if (/收入科目|商品/.test(g)) return;
      }
      if (DISC_HINT.test(n)) discCols.push(i);
      else if (PAY_HINT.test(n)) payCols.push(i);
    });
    return { map, discCols, payCols, used };
  }

  function num(x) {
    if (x == null) return 0;
    if (typeof x === 'number') return x;
    const s = String(x).replace(/[¥,，\s元]/g, '').replace(/^\((.*)\)$/, '-$1');
    const v = parseFloat(s);
    return isFinite(v) ? v : 0;
  }

  function fixDate(s) {
    if (s == null || s === '') return '';
    if (typeof s === 'number') {
      /* excel 序列号 */
      const t = new Date(Math.round((s - 25569) * 86400000));
      return t.toISOString().slice(0, 10);
    }
    const m = String(s).trim().match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
    if (m) return m[1] + '-' + String(+m[2]).padStart(2, '0') + '-' + String(+m[3]).padStart(2, '0');
    if (/^\d{5}$/.test(String(s).trim())) {
      const t = new Date(Math.round((+s - 25569) * 86400000));
      return t.toISOString().slice(0, 10);
    }
    /* 20261031 */
    const m2 = String(s).trim().match(/^(\d{4})(\d{2})(\d{2})$/);
    if (m2) return m2[1] + '-' + m2[2] + '-' + m2[3];
    return '';
  }
  function hourOf(s) {
    if (s == null) return '??';
    const str = String(s);
    const m = str.match(/\s(\d{1,2}):/);
    if (m) return String(+m[1]).padStart(2, '0');
    const m2 = str.match(/^(\d{1,2}):/);
    if (m2) return String(+m2[1]).padStart(2, '0');
    if (/^\d+(\.\d+)?$/.test(str) && +str >= 0 && +str < 1) {
      /* excel 时间小数 */
      return String(Math.floor(+str * 24)).padStart(2, '0');
    }
    return '??';
  }

  /* ---------- 聚合（与 build_v2.py 对齐） ---------- */
  const DIMS = { '渠道': 'ch', '餐段': 'meal', '业务': 'biz' };
  const b0 = () => ({ net: 0, gross: 0, disc: 0, comm: 0, orders: 0, guests: 0 });
  /* 不同 POS 对同一支付方式的叫法不一样，归一化后界面口径才稳定 */
  const PAY_ALIAS = {
    '人民币': '人民币现金', '人民币现金': '人民币现金',
    '二维码（自）': '扫码（自建）', '二维码(自)': '扫码（自建）', '二维码（自建）': '扫码（自建）', '扫码（自建）': '扫码（自建）',
    '会员现金卡值': '会员储值卡', '会员储值卡': '会员储值卡',
    '淘宝闪购·餐饮': '淘宝闪购', '淘宝闪购': '淘宝闪购',
    '系统优惠券': '系统券抵扣'
  };
  const payName = (n) => PAY_ALIAS[String(n || '').trim()] || String(n || '').trim();
  function acc(d, net, gross, disc, comm, guests) {
    d.net += net; d.gross += gross; d.disc += disc; d.comm += comm; d.orders += 1; d.guests += guests;
  }
  function pack(b) {
    const o = b.orders;
    return {
      net: r2(b.net), gross: r2(b.gross), disc: r2(b.disc), comm: r2(b.comm),
      orders: o, guests: Math.round(b.guests), avg: o ? r2(b.net / o) : 0
    };
  }
  const r2 = (n) => Math.round(n * 100) / 100;

  function newStore() {
    return {
      total: b0(), daily: new Map(), dim: {}, dailyDim: {}, hour: new Map(),
      disc: new Map(), discDaily: new Map(), pay: new Map(),
      /* 逐日的支付、逐日的时段：多文件合并时按「门店+日期」去重，
         缺了这两层就只能整店相加，重叠日期会被算两遍。 */
      payDaily: new Map(), hourDaily: new Map(),
      refund: { orders: 0, net: 0, whole: 0 },
      member: { orders: 0, cards: new Map() },
      cust: { phones: new Map() },
      pkg: 0, goods: 0, subsidy: 0, q: {}, codes: new Set()
    };
  }
  function getM(map, k, f) { let v = map.get(k); if (!v) { v = f(); map.set(k, v); } return v; }

  /**
   * rows: [{r,v:[]}]，headerAt: 表头行下标
   * opt: { map, discCols, payCols }
   */
  function aggregate(rows, headerAt, opt) {
    const headers = (rows[headerAt].v || []).map(x => String(x || '').trim());
    const groups = opt.groupAt >= 0 && rows[opt.groupAt] ? (rows[opt.groupAt].v || []) : null;
    const map = opt.map, discCols = opt.discCols, payCols = opt.payCols;
    const stores = new Map();
    const every = newStore();
    const orderIds = new Set();
    let dataRows = 0;

    const storeNames = [];
    const at = (v, i) => (i == null ? '' : (v[i] == null ? '' : v[i]));

    for (let ri = headerAt + 1; ri < rows.length; ri++) {
      const v = rows[ri].v || [];
      const oid = String(at(v, map.order) || '').trim();
      const store = String(at(v, map.store) || '').trim() || '(未标注)';
      const date = fixDate(at(v, map.date));
      /* 没有订单号也没有日期 → 不是数据行（小计、空行） */
      if (!oid && !date) continue;
      if (!date) continue;
      dataRows++;
      if (oid) orderIds.add(oid);
      if (storeNames.indexOf(store) < 0) storeNames.push(store);

      const net = num(at(v, map.net)), gross = num(at(v, map.gross)), disc = num(at(v, map.disc));
      const guests = num(at(v, map.guests)), pkg = num(at(v, map.pkg)), goods = num(at(v, map.goods));
      const subsidy = num(at(v, map.subsidy));
      const hour = hourOf(at(v, map.time));
      const timeRaw = String(at(v, map.time) || '');
      const isRefund = String(at(v, map.direction) || '').indexOf('退') >= 0
        || String(at(v, map.status) || '').indexOf('退款') >= 0;
      const memberCard = String(at(v, map.member) || '').trim();
      const phone = String(at(v, map.phone) || '').trim();
      const code = String(at(v, map.code) || '').trim();

      let comm = 0;
      discCols.forEach(i => { const n = String(headers[i] || ''); if (/佣金|服务费/.test(n)) comm += num(v[i]); });

      const targets = [getM(stores, store, newStore), every];
      for (let ti = 0; ti < targets.length; ti++) {
        const s = targets[ti];
        if (code) s.codes.add(code);
        acc(s.total, net, gross, disc, comm, guests);
        acc(getM(s.daily, date, b0), net, gross, disc, comm, guests);
        acc(getM(s.hour, hour, b0), net, gross, disc, comm, guests);
        acc(getM(getM(s.hourDaily, date, () => new Map()), hour, b0), net, gross, disc, comm, guests);
        for (const d in DIMS) {
          const col = map[DIMS[d]];
          const k = String(at(v, col) || '').trim() || '(空)';
          s.dim[d] = s.dim[d] || new Map();
          acc(getM(s.dim[d], k, b0), net, gross, disc, comm, guests);
          s.dailyDim[d] = s.dailyDim[d] || new Map();
          acc(getM(getM(s.dailyDim[d], date, () => new Map()), k, b0), net, gross, disc, comm, guests);
        }
        discCols.forEach(i => {
          const val = num(v[i]);
          if (!val) return;
          const name = headers[i] || ('优惠' + i);
          s.disc.set(name, (s.disc.get(name) || 0) + val);
          const dd = getM(s.discDaily, date, () => new Map());
          dd.set(name, (dd.get(name) || 0) + val);
        });
        payCols.forEach(i => {
          const val = num(v[i]);
          if (!val) return;
          const name = payName(headers[i]) || ('支付' + i);
          s.pay.set(name, (s.pay.get(name) || 0) + val);
          const pd = getM(s.payDaily, date, () => new Map());
          pd.set(name, (pd.get(name) || 0) + val);
        });
        if (isRefund) { s.refund.orders++; s.refund.net += net; }
        if (String(at(v, map.refund_flag) || '').trim()) s.refund.whole++;
        if (memberCard) { s.member.orders++; s.member.cards.set(memberCard, (s.member.cards.get(memberCard) || 0) + 1); }
        if (phone) s.cust.phones.set(phone, (s.cust.phones.get(phone) || 0) + 1);
        s.pkg += pkg; s.goods += goods; s.subsidy += subsidy;

        /* 体检 */
        const q = s.q;
        if (Math.abs(gross - disc - net) > 0.011) q.gross_net_mismatch = (q.gross_net_mismatch || 0) + 1;
        const dsum = discCols.reduce((t, i) => t + num(v[i]), 0);
        if (discCols.length && Math.abs(dsum - disc) > 0.011) q.disc_detail_mismatch = (q.disc_detail_mismatch || 0) + 1;
        if (payCols.length && Math.abs(payCols.reduce((t, i) => t + num(v[i]), 0) - net) > 0.011) q.pay_detail_mismatch = (q.pay_detail_mismatch || 0) + 1;
        if (/^\d{4}-\d{2}-\d{2}/.test(timeRaw) && timeRaw.slice(0, 10) !== date) q.date_mismatch = (q.date_mismatch || 0) + 1;
        if (guests <= 0) q.zero_guest = (q.zero_guest || 0) + 1;
        const pa = num(at(v, map.post_avg));
        if (guests > 0 && pa > 0 && Math.abs(pa - net / guests) > 0.02) q.avg_mismatch = (q.avg_mismatch || 0) + 1;
        const meal = String(at(v, map.meal) || '');
        if (['00', '01', '02', '03', '04', '05'].indexOf(hour) >= 0 && /早餐|午餐/.test(meal)) {
          q.meal_hour_conflict = (q.meal_hour_conflict || 0) + 1;
        }
      }
    }

    function packStore(s) {
      const cards = s.member.cards, phones = s.cust.phones;
      const cntRepeat = (m) => { let n = 0; m.forEach(c => { if (c >= 2) n++; }); return n; };
      const sumRepeat = (m) => { let n = 0; m.forEach(c => { if (c >= 2) n += c; }); return n; };
      const mkDim = (m) => {
        const arr = [];
        m.forEach((v, k) => arr.push(Object.assign({ name: k }, pack(v))));
        return arr.sort((a, b) => b.net - a.net);
      };
      const dailyDim = {};
      for (const d in DIMS) {
        const src = s.dailyDim[d] || new Map();
        const o = {};
        src.forEach((inner, date) => {
          const row = {};
          inner.forEach((v, k) => { row[k] = [r2(v.net), v.orders, r2(v.gross), r2(v.disc), r2(v.comm)]; });
          o[date] = row;
        });
        dailyDim[d] = o;
      }
      const discDaily = {};
      s.discDaily.forEach((inner, date) => {
        const row = {};
        inner.forEach((v, k) => { if (Math.abs(v) > 0.004) row[k] = r2(v); });
        discDaily[date] = row;
      });
      const payDaily = {};
      s.payDaily.forEach((inner, date) => {
        const row = {};
        inner.forEach((v, k) => { if (Math.abs(v) > 0.004) row[k] = r2(v); });
        payDaily[date] = row;
      });

const HOLIDAY = ['2026-10-01', '2026-10-02', '2026-10-03', '2026-10-04', '2026-10-05', '2026-10-06', '2026-10-07'];
const isHol = (d) => HOLIDAY.indexOf(d) >= 0;
/* 默认口径：近 7 天（同星期对齐，周末效应自动抵消，不受假期基数影响） */
if (state.period === 'd7') { state.b = M.date_max; state.a = addDays(M.date_max, -6); }
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem('wb2') || '{}');
    if (raw.target) state.target = raw.target;
    if (raw.ledger) state.ledger = raw.ledger;
    if (raw.store && (raw.store === '__ALL__' || STORE_KEYS.includes(raw.store))) state.store = raw.store;
  } catch (e) { }
}
function save() {
  try { localStorage.setItem('wb2', JSON.stringify({ target: state.target, ledger: state.ledger, store: state.store })); } catch (e) { }
}

/* ---------- 3. 数据访问 ---------- */
const cur = () => state.store === '__ALL__' ? DATA.all : DATA.stores[state.store];
const curName = () => state.store === '__ALL__' ? '全部门店' : state.store;
function agg(days) {
  const t = { net: 0, gross: 0, disc: 0, comm: 0, orders: 0, guests: 0, days: days.length };
  days.forEach(x => { t.net += x.net; t.gross += x.gross; t.disc += x.disc; t.comm += x.comm; t.orders += x.orders; t.guests += x.guests; });
  t.avg = t.orders ? t.net / t.orders : 0;
  t.discRate = t.gross ? t.disc / t.gross : 0;
  t.takeRate = t.gross ? t.net / t.gross : 0;
  return t;
}
function rangeAgg(a, b) { return agg(cur().daily.filter(x => x.d >= a && x.d <= b)); }
function aggDates(arr) { const s = new Set(arr); return agg(cur().daily.filter(x => s.has(x.d))); }
/* 目标：周期化。存 {cycle:'day'|'week'|'month', value}，内部统一折算日均，
   这样切到近 7 天 / 近 14 天 / 全月，比的是同一个目标，不会忽大忽小 */
const CYCLE_NAME = { day: '日目标', week: '周目标', month: '月目标' };
const TG_PH = { day: '日目标金额，如 30000', week: '周目标金额，如 210000', month: '月目标金额，如 900000' };
function daysInMonth(dateStr) {
  const d = new Date(String(dateStr || M.date_max) + 'T00:00:00');
  if (isNaN(d.getTime())) return 30;
  return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
}
function cycleDivisor(cycle, refDate) {
  if (cycle === 'day') return 1;
  if (cycle === 'week') return 7;
  return daysInMonth(refDate || state.b);
}
function periodSpan() { return Math.max(1, daysBetween(state.a, state.b) + 1); }
/* 数据超过一个月时，「全月」这个说法就不对了：那几处标的是「全期口径」，跟着改叫法 */
const scopeWord = () => (daysBetween(M.date_min, M.date_max) + 1 > 32 ? '全期' : '全月');
/* 覆盖到的自然月：数据跨月时给一组快捷按钮，省得手填日期 */
function monthRanges() {
  const out = [];
  let y = Number(M.date_min.slice(0, 4)), m = Number(M.date_min.slice(5, 7));
  const ly = Number(M.date_max.slice(0, 4)), lm = Number(M.date_max.slice(5, 7));
  while (y < ly || (y === ly && m <= lm)) {
    const key = y + '-' + String(m).padStart(2, '0');
    const endD = new Date(y, m, 0).getDate();
    const a = key + '-01', b = key + '-' + String(endD).padStart(2, '0');
    out.push({ key: key, label: m + ' 月', a: a < M.date_min ? M.date_min : a, b: b > M.date_max ? M.date_max : b });
    m++; if (m > 12) { m = 1; y++; }
  }
  return out;
}
function targetFor() {
  const raw = state.target[state.store];
  if (raw == null || raw === '') return { cycle: 'month', value: 0, daily: 0, ok: false };
  /* 兼容旧版存纯数字的情况：按「月目标」理解 */
  const t = (typeof raw === 'number') ? { cycle: 'month', value: raw } : raw;
  const value = Number(t.value || 0);
  const cycle = t.cycle || 'month';
  if (!(value > 0)) return { cycle: cycle, value: 0, daily: 0, ok: false };
  return { cycle: cycle, value: value, daily: value / cycleDivisor(cycle), ok: true };
}
function setTargetFor(cycle, value) {
  state.target[state.store] = { cycle: cycle, value: Number(value) || 0 };
  save();
}
/* 一句话说清：设的是什么周期、折算到当前区间是多少 */
function targetPhrase(span) {
  const t = targetFor();
  if (!t.ok) return '未设目标';
  const n = span || periodSpan();
  return `${CYCLE_NAME[t.cycle]} ${money(t.value)} → 本期 ${n} 天折算 ${money(t.daily * n)}`;
}

/* 任意日期集合上的维度聚合（来自日×维度明细） */
function dimOn(dim, dates, storeObj) {
  const set = new Set(dates), src = (storeObj || cur()).dailyDim[dim], m = {};
  for (const d in src) {
    if (!set.has(d)) continue;
    for (const k in src[d]) {
      const a = src[d][k];
      const o = m[k] = m[k] || { name: k, net: 0, orders: 0, gross: 0, disc: 0, comm: 0 };
      o.net += a[0]; o.orders += a[1]; o.gross += (a[2] || 0); o.disc += (a[3] || 0); o.comm += (a[4] || 0);
    }
  }
  return Object.values(m).map(x => ({ ...x, avg: x.orders ? x.net / x.orders : 0 }));
}
/* 区间内的维度经济性（渠道做 POS 合并，与「归因」页保持一致） */
function dimRange(dim, a, b, storeObj) {
  const st = storeObj || cur();
  const ds = st.daily.filter(x => x.d >= a && x.d <= b).map(x => x.d);
  let rows = dimOn(dim, ds, st).map(r => ({ ...r, take: div(r.net, r.gross) }));
  if (dim === '渠道') {
    const m = {};
    rows.forEach(r => {
      const k = CH_MERGE(r.name);
      const o = m[k] = m[k] || { name: k, net: 0, orders: 0, gross: 0, disc: 0, comm: 0 };
      o.net += r.net; o.orders += r.orders; o.gross += r.gross; o.disc += r.disc; o.comm += r.comm;
    });
    rows = Object.values(m).map(o => ({ ...o, avg: div(o.net, o.orders) || 0, take: div(o.net, o.gross) }));
  }
  return rows.sort((p, q) => q.net - p.net);
}

/* ---------- 4. 分析引擎 ---------- */
/* 4.1 同星期基线 */
function weekdayBase(date) {
  /* 同星期基线也要剔假期：拿平常周四跟「国庆周四」平均，会把基准抬高、把正常日子误判成异常 */
  const peers = cur().daily.filter(x => x.d !== date && wdOf(x.d) === wdOf(date) && !(state.exHoliday && isHol(x.d)));
  if (!peers.length) return null;
  const t = agg(peers);
  return { net: t.net / peers.length, orders: t.orders / peers.length, avg: t.avg, n: peers.length, peers: peers.map(x => x.d) };
}
/* 4.2 区间对比（自动选参照） */
/* 对比用的日期序列：默认剔除假期日，保证「可比」 */
function campDates(a, b, useHol) {
  const s = cur();
  return s.daily.filter(x => x.d >= a && x.d <= b).map(x => x.d)
    .filter(d => useHol ? !isHol(d) : true);
}
function compare(a, b, opt) {
  const useHol = (opt && opt.holiday === false) ? false : state.exHoliday;
  const ds = campDates(a, b, useHol);
  const n = ds.length;
  const first = cur().daily[0].d;
  const ps = addDays(a, -n);
  if (ps >= first) {
    const raw = []; for (let i = n; i >= 1; i--) raw.push(addDays(a, -i));
    /* 基线也要剔除假期，否则「上期含国庆」会把本期衬得虚高；剔完按日均折算 */
    const bd = useHol ? raw.filter(d => !isHol(d)) : raw;
    const A = aggDates(ds), B = aggDates(bd);
    const scale = (A.days && B.days) ? A.days / B.days : 1;
    const holInB = raw.length - bd.length;
    const isWeek = raw.length === 7;
    const labelB = isWeek
      ? `上周（${md(raw[0])}~${md(raw[6])}）`
      : `${raw.length === 14 ? '前两周' : `前 ${raw.length} 天`}（${md(raw[0])}~${md(raw[raw.length - 1])}${holInB ? `，已剔 ${holInB} 天假期` : ''}）`;
    return {
      aDates: ds, bDates: bd, A, B, scale, holInB,
      labelA: isWeek ? '本周' : (raw.length === 14 ? '近 14 天' : '本期'),
      shortB: isWeek ? '上周' : (raw.length === 14 ? '前两周' : '上期'),
      labelB, kind: 'prev',
      baseDesc: isWeek ? '上一周（同星期对齐）' : '上期等长区间'
    };
  }
  const h = Math.floor(n / 2);
  if (h < 1 || n - h < 1) {
    const A = aggDates(ds), B = A;
    return { aDates: ds, bDates: ds, A, B, scale: 1, labelA: '本期', shortB: '本期', labelB: '本期（无可比区间）', kind: 'none', baseDesc: '无可比区间' };
  }
  /* 前后半段天数常不相等，必须按日均折算（scale）后才可比 */
  const aD = ds.slice(h), bD = ds.slice(0, h);
  const A = aggDates(aD), B = aggDates(bD);
  const scale = B.days ? A.days / B.days : 1;
  return {
    aDates: aD, bDates: bD, A, B, scale,
    labelA: '后半段', shortB: '前半段',
    labelB: `前半段（${B.days} 天${A.days !== B.days ? `，折算成 ${A.days} 天口径` : ''}）`,
    kind: 'split', baseDesc: '区间内前后半段（已折日均）'
  };
}
/* 4.3 单日 vs 同星期 */
function compareDay(date) {
  const base = weekdayBase(date);
  if (!base) return null;
  const A = aggDates([date]);
  const B = { net: base.net * base.n, orders: base.orders * base.n, avg: base.avg, gross: 0, disc: 0, comm: 0, guests: 0, days: base.n };
  return {
    aDates: [date], bDates: base.peers, A, B, scale: 1 / base.n,
    labelA: `${md(date)}（${wdName(date)}）`,
    labelB: `同星期均值（${wdName(date)} × ${base.n} 天）`,
    shortB: '同星期均值',
    kind: 'weekday', baseDesc: '同星期均值'
  };
}
/* 4.4 结构归因 + 量价拆解 */
const CH_MERGE = (n) => /收银POS|移动收银POS/.test(n) ? '门店自收' : n;
function mergeRows(rows, key) {
  const m = {};
  rows.forEach(r => {
    const k = key(r.name);
    if (!m[k]) m[k] = { name: k, dim: r.dim, netA: 0, netB: 0, ordA: 0, ordB: 0, dNet: 0, qty: 0, price: 0 };
    const o = m[k];
    o.netA += r.netA; o.netB += r.netB; o.ordA += r.ordA; o.ordB += r.ordB;
    o.dNet += r.dNet; o.qty += r.qty; o.price += r.price;
  });
  return Object.values(m).map(o => Object.assign(o, {
    avgA: o.ordA ? o.netA / o.ordA : 0,
    avgB: o.ordB ? o.netB / o.ordB : 0
  }));
}
function attribute(c, dim) {
  const A = dimOn(dim, c.aDates), B = dimOn(dim, c.bDates);
  const bm = {}; B.forEach(x => bm[x.name] = x);
  const names = Array.from(new Set([...A.map(x => x.name), ...B.map(x => x.name)]));
  let rows = names.map(n => {
    const x = A.find(y => y.name === n) || { net: 0, orders: 0, avg: 0 };
    const y = bm[n] || { net: 0, orders: 0, avg: 0 };
    const netB = y.net * c.scale, ordB = y.orders * c.scale;
    const dNet = x.net - netB;
    const qty = (x.orders - ordB) * y.avg;
    const price = x.orders * (x.avg - y.avg);
    return { name: n, dim, netA: x.net, netB, ordA: x.orders, ordB, avgA: x.avg, avgB: y.avg, dNet, qty, price };
  });
  if (dim === '渠道') rows = mergeRows(rows, CH_MERGE);
  rows.sort((p, q) => Math.abs(q.dNet) - Math.abs(p.dNet));
  return rows;
}
function natureOf(r) {
  const q = Math.abs(r.qty), p = Math.abs(r.price);
  const qu = r.qty > 0, pu = r.price > 0;
  if (!qu && pu) return '减量提价';
  if (qu && !pu) return '以价换量';
  if (q > 2.2 * p) return '单量问题';
  if (p > 2.2 * q) return '客单问题';
  return r.dNet < 0 ? '量价同降' : '量价同涨';
}
function totalsSplit(c) {
  const A = c.A, B = c.B;
  const netB = B.net * c.scale, ordB = B.orders * c.scale;
  const qty = (A.orders - ordB) * B.avg;
  const price = A.orders * (A.avg - B.avg);
  return { qty, price, dNet: A.net - netB, netB, ordB };
}

/* 措辞助手：整体是涨的时候不能说「多降」，只能说「比整体低」 */
function gapPhrase(gap, overall) {
  const pp = (Math.abs(gap) * 100).toFixed(1);
  return (overall == null || overall < 0) ? `比整体多降 ${pp}pp` : `比整体低 ${pp}pp`;
}
/* 4.5 驱动项：区分「整体性回落」与「结构性拖累」 */
const OPERABLE = (name) => /美团|淘宝|饿了么|小程序|抖音/.test(name);
function driverRows(c) {
  const totB = c.B.net * c.scale;
  const overall = div(c.A.net - totB, totB) || 0;
  const out = [];
  const add = (dim, rows) => rows.forEach(r => {
    const rate = div(r.dNet, r.netB);
    out.push(Object.assign({}, r, {
      dim,
      share: div(r.netB, totB) || 0,
      rate: rate,
      gap: (rate || 0) - overall
    }));
  });
  add('渠道', attribute(c, '渠道'));
  add('餐段', attribute(c, '餐段'));
  add('业务', attribute(c, '业务'));
  return { rows: out, overall };
}

/* 4.6 一句话结论 */
function narrate(c) {
  const t = totalsSplit(c);
  const { rows, overall } = driverRows(c);
  /* 金额门槛：小于「实收 0.5%」且不足 ¥400 的项是噪音，不该被点名成「最该先看」 */
  const floor = Math.max(400, Math.abs(c.B.net * c.scale) * 0.005);
  const neg = rows.filter(r => r.dNet < -1).sort((a, b) => a.dNet - b.dNet);
  const negBig = neg.filter(r => Math.abs(r.dNet) >= floor);
  const pos = rows.filter(r => r.dNet > 1 && Math.abs(r.dNet) >= 300 && r.share >= 0.02).sort((a, b) => b.dNet - a.dNet);
  const sumNeg = neg.reduce((s, r) => s + Math.abs(r.dNet), 0) || 1;
  const topNeg = negBig[0] || null;
  /* 只有「占比大 + 降幅明显差于整体」才算结构性拖累；份额大的主力项同步下滑属于整体性 */
  const concentrated = topNeg
    ? (Math.abs(topNeg.dNet) / sumNeg > 0.55 && topNeg.gap < -0.05)
    : false;
  const struct = negBig.filter(r => r.gap < -0.025 && r.share >= 0.01)
    .sort((a, b) => b.share * Math.abs(b.gap) - a.share * Math.abs(a.gap))[0] || null;
  const best = pos[0] || null;
  /* 有几个维度是「普遍在降」 */
  const fallingDims = ['渠道', '餐段'].filter(d => {
    const rs = rows.filter(r => r.dim === d && r.share > 0.01);
    return rs.length >= 3 && rs.filter(r => r.dNet < 0).length / rs.length >= 0.6;
  });
  /* 可运营的主驱动项：只从外卖平台/小程序/餐段里选，POS 只是收银工具不是渠道 */
  const primary = neg
    .filter(r => r.dim === '餐段' || (r.dim === '渠道' && OPERABLE(r.name)))
    .filter(r => r.share >= 0.02)
    .sort((a, b) => b.share * Math.abs(b.rate || 0) - a.share * Math.abs(a.rate || 0))[0] || topNeg;

  const oQ = div(c.A.orders / c.A.days - c.B.orders / c.B.days, c.B.orders / c.B.days);
  const oP = div(c.A.avg - c.B.avg, c.B.avg);
  /* 量价方向要分开说：同样是「单量涨单均降」，涨的时候叫以价换量，跌的时候才是量价同降 */
  const qUp = t.qty > 0, pUp = t.price > 0;
  const overallNature = (qUp && pUp) ? '量价齐升'
    : (!qUp && !pUp) ? '量价同降'
      : qUp ? '以价换量' : '减量提价';
  const natureSentence = overallNature === '量价齐升' ? '客流和单均一起涨'
    : overallNature === '量价同降' ? '客流和单均一起降'
      : overallNature === '以价换量' ? '客流涨、单均降（以价换量）'
        : '客流降、单均涨（减量提价）';

  const tag = t.dNet < -1 ? 'bad' : t.dNet > 1 ? 'good' : 'flat';
  /* 以价换量：流水涨得比实收快，说明多做的生意被优惠吃掉了——这是店长最容易漏掉的亏钱方式 */
  const gRate = div(c.A.gross - c.B.gross * c.scale, c.B.gross * c.scale);
  const netRate = div(t.dNet, t.netB);
  const effNote = (gRate != null && netRate != null && gRate - netRate > 0.02 && c.A.discRate != null)
    ? (gRate > 0
      ? `流水 ${spct(gRate)}，实收只 ${spct(netRate)}——差额被优惠吃掉：优惠率 ${pct(c.A.discRate)}（前期 ${pct(c.B.discRate)}），到手率 ${pct(c.A.takeRate)}（前期 ${pct(c.B.takeRate)}）。多做的单没换成钱。`
      : `流水 ${spct(gRate)}，实收 ${spct(netRate)}，掉得更快——优惠给多了：优惠率 ${pct(c.A.discRate)}（前期 ${pct(c.B.discRate)}），到手率 ${pct(c.A.takeRate)}（前期 ${pct(c.B.takeRate)}）。生意没做大，让利先上去了。`)
    : (gRate != null && netRate != null && netRate - gRate > 0.02
      ? `实收 ${spct(netRate)} 快过流水 ${spct(gRate)}——优惠收窄或渠道结构变好，同样的流水多留住了钱。`
      : null);
  const head = `${c.labelA}实收 ${money(c.A.net)}，比${c.labelB}${t.dNet < 0 ? '少' : '多'} ${money(Math.abs(t.dNet))}（${spct(div(t.dNet, t.netB))}）`;

  const lines = [];
  if (neg.length && concentrated) {
    lines.push(t.dNet >= 0
      ? `整体是正的，拖后腿的只有<b>${topNeg.dim}·${esc(topNeg.name)}</b>：${sm(topNeg.dNet)}，占全部负向差距 <b>${pct(Math.abs(topNeg.dNet) / sumNeg, 0)}</b>，也是唯一跑输整体的项。`
      : `缺口集中在<b>${topNeg.dim}·${esc(topNeg.name)}</b>，占全部负向差距 <b>${pct(Math.abs(topNeg.dNet) / sumNeg, 0)}</b>，且降幅比整体更深——这是结构性问题，不是普跌。`);
  } else if (fallingDims.length) {
    lines.push(overall < 0
      ? `<b>${fallingDims.join('、')}</b>普遍在降，属于<b>整体性回落</b>——先排除天气、假期、周边施工这类外部因素，再谈动作。`
      : `<b>${fallingDims.join('、')}</b>里多数项在降，但整体仍 ${spct(overall)}——不是普涨，是少数几项在撑，得先看清是哪几项。`);
  } else if (topNeg) {
    lines.push(`主要缺口在<b>${topNeg.dim}·${esc(topNeg.name)}</b> ${sm(topNeg.dNet)}（${spct(topNeg.rate)}）。`);
  }
  if (struct && (!topNeg || struct.dim !== topNeg.dim || struct.name !== topNeg.name)) {
    lines.push(`跑输整体的是<b>${struct.dim}·${esc(struct.name)}</b>：${spct(struct.rate)}，<b>${gapPhrase(struct.gap, div(t.dNet, t.netB))}</b>；单量 ${spct(div(struct.ordA - struct.ordB, struct.ordB))}、单均 ${spct(div(struct.avgA - struct.avgB, struct.avgB))} → <b>${natureOf(struct)}</b>。`);
  } else if (topNeg) {
    lines.push(`其中<b>${esc(dimName(topNeg.dim))}·${esc(topNeg.name)}</b> 单量 ${spct(div(topNeg.ordA - topNeg.ordB, topNeg.ordB))}、单均 ${spct(div(topNeg.avgA - topNeg.avgB, topNeg.avgB))} → <b>${natureOf(topNeg)}</b>。`);
  }
  if (best && t.dNet < 0) lines.push(`逆势的是<b>${best.dim}·${esc(best.name)}</b> ${sm(best.dNet)}，可以看它做对了什么。`);
  if (!neg.length) lines.push('各维度都没有明显下滑，差距来自整体波动，建议切到单日看异常。');

  /* 让利不划算时，它比任何单一渠道都更该先看——否则 hero 会让店长跑去查一个 ¥600 的美团 */
  const lvN = leverage(c);
  const levBad = lvN && (lvN.lv === 'warn' || lvN.lv === 'bad') && lvN.ratio != null;
  const topOwn = discSplit(c).rows.filter(r => !r.comm && r.d > 0)[0];
  const why = levBad
    ? (topOwn
      ? `最该先看：<b>${esc(topOwn.name)}</b>——多让 <b>${money(topOwn.d)}</b>，每多让 1 元只收回 <b>${lvN.ratio.toFixed(2)} 元</b>。`
      : `最该先看：<b>优惠力度</b>——每多让 1 元只收回 <b>${lvN.ratio.toFixed(2)} 元</b>实收`)
    : struct
      ? `最该先看：<b>${esc(dimName(struct.dim))}·${esc(struct.name)}</b> ${spct(struct.rate)}，${gapPhrase(struct.gap, div(t.dNet, t.netB))}`
      : topNeg ? `最该先看：<b>${esc(dimName(topNeg.dim))}·${esc(topNeg.name)}</b> ${sm(topNeg.dNet)}` : '各维度无显著异动';

  return {
    dNet: t.dNet, rate: div(t.dNet, t.netB), tag, head, lines,
    top: topNeg, struct, best, primary, overallNature, natureSentence, effNote,
    qty: t.qty, price: t.price, netB: t.netB, oQ, oP, why, overall,
    negCount: neg.length, concentrated
  };
}

/* 4.6 动作建议库 */
function adviceFor(dim, name, nature) {
  if (dim === '渠道') {
    if (nature === '以价换量') return { t: `${name} 的单是不是买来的`, d: '单量涨了但单均降得更多：把满减/折扣收一档试 3 天，看单量掉多少——掉得少说明这些单本来就会来，补贴白给了。', own: '店长 + 线上运营' };
    if (nature === '单量问题') return { t: `找回 ${name} 的曝光与进店`, d: '核对平台曝光量、活动报名状态与满减门槛；若曝光正常，查评分、出餐时长与配送范围。', own: '店长 + 线上运营' };
    if (nature === '客单问题') return { t: `重做 ${name} 的起送与套餐结构`, d: '对比该渠道的起送价、凑单价与套餐搭配；把高毛利小食做成加购项。', own: '店长' };
    return { t: `${name} 量价一起查`, d: '先确认是主动调了活动力度，还是被竞品分流：看曝光、评分、满减门槛三项，再决定是拉量还是保价。', own: '店长 + 线上运营' };
  }
  if (dim === '餐段') {
    if (nature === '以价换量') return { t: `别用让利换 ${name} 的量`, d: '该时段单量涨、单均降：先看主推品是否被低价单品挤掉，再把高毛利小食/饮品前置到套餐里，把客单拉回来。', own: '店长 + 后厨' };
    if (nature === '减量提价') return { t: `${name} 的客流要补回来`, d: '单均涨了但单量掉了：检查是否调价过猛或分量/出品有变化，用加料包或第二份半价把人数拉回。', own: '店长' };
    if (nature === '单量问题') return { t: `补 ${name} 的时段客流`, d: '核对该时段排班与备货是否够；做时段专属产品或限时折扣，把相邻时段的客流转过来。', own: '店长 + 后厨' };
    if (nature === '客单问题') return { t: `提 ${name} 的时段客单`, d: '该时段主推组合餐与饮品加购，检查是否只卖了低价单品。', own: '店长' };
    return { t: `先看 ${name} 的客流与出品`, d: '单量和单均一起降，通常是客流少了又不敢卖贵的：先查该时段出餐速度与排队时长，再看主推品是否缺货。', own: '店长 + 后厨' };
  }
  if (dim === '业务') {
    return { t: `调整 ${name} 的经营方式`, d: '核对开通状态、配送范围与打包成本；按到手率重排优先级。', own: '店长' };
  }
  return { t: '复核该维度', d: '数据量偏小，先补足样本再做动作。', own: '店长' };
}

/* 4.7 优惠结构 */
function moneyFlow(s) {
  const t = s.total;
  const comm = t.comm;
  const disc = t.disc;
  const own = disc - comm;
  return { gross: t.gross, comm, own, disc, net: t.net, commRate: div(comm, t.gross) || 0, ownRate: div(own, t.gross) || 0, netRate: div(t.net, t.gross) || 0 };
}

/* ---------- 5. 待办引擎 ---------- */
const DIM_LABEL = { '渠道': '渠道', '餐段': '餐段', '业务': '业务类型' };
const dimName = (d) => DIM_LABEL[d] || d;
function buildTodos() {
  const s = cur(), out = [], dayItems = [];
  /* 5.1 异常日：只报「不该这么低」的日子，冲高不算待办 */
  const days = s.daily.filter(x => x.d >= state.a && x.d <= state.b);
  const scored = days.map(x => {
    const b = weekdayBase(x.d);
    if (!b || !b.net) return null;
    return { d: x.d, net: x.net, base: b.net, dev: x.net - b.net, rate: (x.net - b.net) / b.net };
  }).filter(Boolean)
    .filter(x => x.dev < 0 && Math.abs(x.dev) >= 300 && Math.abs(x.rate) >= 0.12)
    .sort((p, q) => p.dev - q.dev);
  scored.slice(0, 2).forEach(x => dayItems.push({
    kind: '异常日', icon: 'alert', tone: 'red',
    title: `${md(x.d)} ${wdName(x.d)} 只卖了 ${money(x.net)}，比同星期少 ${pct(Math.abs(x.rate))}`,
    meta: `同星期均值 ${money(x.base)}，少 ${money(Math.abs(x.dev))}。先查是否停业、断网、缺货或大额退款`,
    amt: x.dev, cta: '查原因', go: { view: 'why', focus: x.d }
  }));

  /* 5.2 结构性下滑：只报「比整体降得更深」的可运营项 */
  const c = compare(state.a, state.b);
  if (c.kind !== 'none') {
    const { rows } = driverRows(c);
    const picks = rows
      .filter(r => (r.dim === '餐段' || (r.dim === '渠道' && OPERABLE(r.name))))
      .filter(r => r.dNet < -Math.max(400, c.B.net * c.scale * 0.005) && r.gap < -0.03)
      .sort((a, b) => a.dNet - b.dNet);
    const used = [], seenDims = new Set();
    for (const r of picks) {
      if (used.length >= 2) break;
      if (seenDims.has(r.dim)) continue;
      seenDims.add(r.dim); used.push(r);
    }
    used.forEach(r => out.push({
      kind: dimName(r.dim) + '下滑', icon: 'down', tone: 'red',
      title: `${r.name} 少卖 ${money(Math.abs(r.dNet))}，${gapPhrase(r.gap, c.A.net / (c.B.net * c.scale) - 1)}`,
      meta: `${natureOf(r)}：单量 ${spct(div(r.ordA - r.ordB, r.ordB))}、单均 ${spct(div(r.avgA - r.avgB, r.avgB))} · 对照${c.labelB}`,
      amt: r.dNet, cta: '看归因', go: { view: 'why', dim: r.dim }
    }));
  }
  /* 5.2b 让利效率：不是某个渠道塌了，是「多让的钱没换回等量的实收」——全店层面的病，最该先看 */
  const lv = leverage(c);
  if (lv && (lv.lv === 'warn' || lv.lv === 'bad') && lv.ratio != null) {
    const waste = lv.dDisc - lv.dNet;
    out.unshift({
      kind: '让利效率', icon: 'alert', tone: 'red',
      title: `多让 ${money(lv.dDisc)} 优惠，只换回 ${money(Math.max(0, lv.dNet))} 实收`,
      meta: `${(() => { const t = discSplit(c).rows.filter(r => !r.comm && r.d > 0)[0]; return t ? `主要在「${t.name}」（多让 ${money(t.d)}）· ` : ''; })()}每多让 1 元收回 ${lv.ratio.toFixed(2)} 元 · 到手率 ${pct(c.B.takeRate)}→${pct(c.A.takeRate)} · 相当于白扔 ${money(waste)}`,
      amt: -waste, cta: '拆开看', go: { view: 'struct' }
    });
  }
  /* 结构性问题排前面（能改），单日异常排后面（先核实） */
  out.push(...dayItems);
  /* 5.3 掉队门店（仅全店视角） */
  if (state.store === '__ALL__') {
    const rows = STORE_KEYS.map(k => {
      const st = DATA.stores[k], sub = st.daily.filter(x => x.d >= state.a && x.d <= state.b);
      return { k, net: agg(sub).net };
    }).sort((p, q) => p.net - q.net);
    const avg = rows.reduce((t, x) => t + x.net, 0) / rows.length;
    if (rows[0] && rows[0].net < avg * 0.9) {
      out.push({
        kind: '门店', icon: 'store', tone: 'amber',
        title: `${rows[0].k} 低于门店均值 ${pct(1 - rows[0].net / avg)}`,
        meta: `本期 ${money(rows[0].net)}，三店均值 ${money(avg)}`,
        amt: rows[0].net - avg, cta: '切到该店', go: { view: 'struct', store: rows[0].k }
      });
    }
  }
  /* 5.4 超期动作 */
  const overdue = state.ledger.filter(x => x.status !== '已完成' && x.status !== '已放弃' && x.due && x.due < M.date_max);
  if (overdue.length) out.push({
    kind: '动作超期', icon: 'clock', tone: 'amber',
    title: `${overdue.length} 项动作已过截止日未结`,
    meta: overdue.slice(0, 2).map(x => x.title).join('；'),
    amt: null, cta: '去处理', go: { view: 'action' }
  });
  /* 5.5 口径/目标缺口 */
  if (!targetFor().ok) out.push({
    kind: '待设目标', icon: 'flag', tone: 'gray',
    title: '本店还没设目标，无法判断达成',
    meta: '选日/周/月任一周期设一次，之后切任何区间都自动折算',
    amt: null, cta: '去设置', go: { view: 'home', anchor: 'target' }
  });
  return out;
}

/* ---------- 6. 图表 ---------- */
function trendChart(days, a, b) {
  if (!days.length) return '';
  const W = 900, H = 220, L = 52, R = 14, T = 14, B = 28;
  const vals = days.map(d => d.net);
  const mx = Math.max(...vals, 1);
  const yMax = Math.max(1000, Math.ceil(mx * 1.1 / 1000) * 1000);
  const x = i => L + (days.length === 1 ? (W - L - R) / 2 : (i / (days.length - 1)) * (W - L - R));
  const y = v => H - B - (v / yMax) * (H - T - B);
  let grid = '';
  for (let i = 0; i <= 3; i++) {
    const gy = T + (i / 3) * (H - T - B), gv = yMax * (1 - i / 3);
    grid += `<line x1="${L}" y1="${gy}" x2="${W - R}" y2="${gy}" stroke="#F0E9E2" stroke-width="1"/>`;
    grid += `<text x="${L - 8}" y="${gy + 4}" text-anchor="end" font-size="10" fill="#A2958C">${nf(gv / 1000, 0)}k</text>`;
  }
  const area = `M${x(0)},${H - B} ` + days.map((d, i) => `L${x(i)},${y(d.net)}`).join(' ') + ` L${x(days.length - 1)},${H - B} Z`;
  const line = days.map((d, i) => `${i ? 'L' : 'M'}${x(i)},${y(d.net)}`).join(' ');
  const maArr = ma(vals, 7);
  const maPath = maArr.map((v, i) => `${i ? 'L' : 'M'}${x(i)},${y(v)}`).join(' ');
  let pts = '', labs = '';
  days.forEach((d, i) => {
    pts += `<circle cx="${x(i)}" cy="${y(d.net)}" r="2.8" fill="#fff" stroke="#E2552B" stroke-width="1.8"><title>${d.d} ${wdName(d.d)}  实收 ${money2(d.net)} · ${nf(d.orders)} 单 · 单均 ${money2(d.avg)}</title></circle>`;
    if (i % Math.ceil(days.length / 8) === 0 || i === days.length - 1)
      labs += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#A2958C">${md(d.d)}</text>`;
  });
  return `<div class="chartscroll"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${grid}
    <path d="${area}" fill="url(#grad1)" opacity=".55"/>
    <defs><linearGradient id="grad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2552B" stop-opacity=".28"/><stop offset="100%" stop-color="#E2552B" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${line}" fill="none" stroke="#E2552B" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="${maPath}" fill="none" stroke="#8B7A6D" stroke-width="1.3" stroke-dasharray="5 4" opacity=".75"/>
    ${pts}${labs}
  </svg></div>`;
}
function ma(arr, k) {
  return arr.map((_, i) => { const s = Math.max(0, i - k + 1); const seg = arr.slice(s, i + 1); return seg.reduce((a, b) => a + b, 0) / seg.length; });
}


/* 5.4 多做的流水去哪了：把 Δ流水 拆成 Δ平台佣金 + Δ商家让利 + Δ实收，口径必须闭合 */
function flowSplit(c) {
  const A = c.A, B = c.B, k = c.scale;
  const b = (x) => x * k;
  const dGross = A.gross - b(B.gross);
  const dComm = A.comm - b(B.comm);
  const dDisc = A.disc - b(B.disc);
  const dOwn = dDisc - dComm;          // 商家自己让的（优惠合计 − 平台佣金）
  const dNet = A.net - b(B.net);
  return {
    dGross, dComm, dDisc, dOwn, dNet,
    ownRate: dGross ? dOwn / dGross : 0,
    rows: [
      { k: '流水', d: dGross, amt: dGross, word: dGross >= 0 ? '多做' : '少做', strong: true },
      { k: '平台佣金', d: -dComm, amt: Math.abs(dComm), word: dComm >= 0 ? '多付' : '少付', indent: 1 },
      { k: '商家让利', d: -dOwn, amt: Math.abs(dOwn), word: dOwn >= 0 ? '多让' : '少让', indent: 1 },
      { k: '实收', d: dNet, amt: dNet, word: dNet >= 0 ? '多收' : '少收', strong: true }
    ]
  };
}
function flowBlock(c) {
  if (c.kind === 'none') return '';
  const f = flowSplit(c);
  if (Math.abs(f.dGross) < 300) return '';
  const pctOf = (v) => f.dGross ? Math.abs(v / f.dGross) : 0;
  const rows = f.rows.map(r => {
    const good = Math.abs(r.d) < 1 ? null : r.d > 0;
    const col = good === null ? 'var(--ink3)' : good ? 'var(--pos)' : 'var(--neg)';
    const barW = Math.min(100, pctOf(r.d) * 100);
    return `<div class="fl ${r.strong ? 'strong' : ''} ${r.indent ? 'ind' : ''}">
      <div class="flk">${r.k}</div>
      <div class="flb"><i style="width:${barW}%;background:${col}"></i></div>
      <div class="flv" style="color:${col}"><span class="w">${Math.abs(r.amt) < 1 ? '' : r.word}</span>${Math.abs(r.amt) < 1 ? '—' : money(Math.abs(r.amt))}</div>
      <div class="flp">${r.strong || Math.abs(f.dGross) < 1 ? '' : pct(pctOf(r.d))}</div>
    </div>`;
  }).join('');
  const verdict = f.dOwn > 0
    ? `多做的 <b>${money(Math.abs(f.dGross))}</b> 流水里，<b>${money(f.dOwn)}（${pct(f.ownRate)}）</b>被自己加的让利吃掉${f.dComm < 0 ? `，平台佣金反而少了 <b>${money(Math.abs(f.dComm))}</b>` : `，平台佣金也多了 <b>${money(f.dComm)}</b>`}——问题不在平台，在自己的折扣力度。`
    : `多做的流水里让利没扩大，钱基本落进了实收。`;
  return `<div class="card pad">
    <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap">
      <h3 style="margin:0;font-size:13.5px;font-weight:600">多做的流水去哪了</h3>
      <span class="hint">对照${esc(c.labelB)}</span>
      <div class="sp"></div>
      <span class="hint">流水 − 优惠 = 实收，三项闭合</span>
    </div>
    <div class="flowbox">${rows}</div>
    <p style="margin:12px 0 0;font-size:13px;color:var(--ink2);line-height:1.8">${verdict}</p>
  </div>`;
}

/* ---------- 周对比三件套 ---------- */
/* 5.1 逐日配对：本周第 N 天 vs 上周第 N 天，同星期对同星期，周末效应自动抵消 */
function pairWeekChart(c) {
  const A = c.aDates.slice().sort(), B = c.bDates.slice().sort();
  if (A.length !== B.length || !A.length) return '';
  const W = 900, H = 236, L = 46, R = 12, T = 30, Bm = 44;
  const pairs = A.map((d, i) => {
    const a = cur().daily.find(x => x.d === d) || { net: 0, orders: 0 };
    const b = cur().daily.find(x => x.d === B[i]) || { net: 0, orders: 0 };
    return { d, d0: B[i], a: a.net, b: b.net, oa: a.orders, ob: b.orders, r: b.net ? (a.net - b.net) / b.net : null };
  });
  const mx = Math.max(...pairs.map(p => Math.max(p.a, p.b)), 1);
  const yMax = Math.ceil(mx * 1.12 / 500) * 500;
  const y = v => H - Bm - (v / yMax) * (H - T - Bm);
  const gw = (W - L - R) / pairs.length;
  const bw = Math.min(26, gw * 0.26);
  let grid = '';
  for (let i = 0; i <= 3; i++) {
    const gy = T + (i / 3) * (H - T - Bm), gv = yMax * (1 - i / 3);
    grid += `<line x1="${L}" y1="${gy}" x2="${W - R}" y2="${gy}" stroke="#F0E9E2"/>`;
    grid += `<text x="${L - 8}" y="${gy + 4}" text-anchor="end" font-size="10" fill="#A2958C">${nf(gv / 1000, 0)}k</text>`;
  }
  let bars = '', labs = '';
  pairs.forEach((p, i) => {
    const cx = L + gw * i + gw / 2;
    const xa = cx - bw - 3, xb = cx + 3;
    const ya = y(p.a), yb = y(p.b);
    bars += `<rect x="${xb}" y="${yb}" width="${bw}" height="${H - Bm - yb}" rx="2" fill="#DED0C4"><title>上周 ${p.d0} ${wdName(p.d0)}  实收 ${money2(p.b)} · ${nf(p.ob)} 单</title></rect>`;
    bars += `<rect x="${xa}" y="${ya}" width="${bw}" height="${H - Bm - ya}" rx="2" fill="${p.a >= p.b ? '#E2552B' : '#B9A79A'}"><title>本周 ${p.d} ${wdName(p.d)}  实收 ${money2(p.a)} · ${nf(p.oa)} 单</title></rect>`;
    const up = p.r != null && p.r > 0.005, dn = p.r != null && p.r < -0.005;
    const col = up ? '#166B52' : dn ? '#8E2F24' : '#A2958C';
    const txt = p.r == null ? '—' : (p.r >= 0 ? '+' : '−') + Math.abs(p.r * 100).toFixed(0) + '%';
    bars += `<text x="${cx}" y="${Math.min(ya, yb) - 7}" text-anchor="middle" font-size="10.5" font-weight="600" fill="${col}">${txt}</text>`;
    labs += `<text x="${cx}" y="${H - 26}" text-anchor="middle" font-size="10.5" fill="#6B6058" font-weight="500">${wdName(p.d)}</text>`;
    labs += `<text x="${cx}" y="${H - 12}" text-anchor="middle" font-size="9.5" fill="#A2958C">${Number(p.d.slice(8))}日</text>`;
  });
  const legend = `<g><rect x="${L}" y="6" width="9" height="9" rx="2" fill="#E2552B"/><text x="${L + 14}" y="14" font-size="10.5" fill="#6B6058">本周</text>
    <rect x="${L + 56}" y="6" width="9" height="9" rx="2" fill="#DED0C4"/><text x="${L + 70}" y="14" font-size="10.5" fill="#6B6058">上周</text></g>`;
  return `<div class="chartscroll"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${legend}${grid}<line x1="${L}" y1="${H - Bm}" x2="${W - R}" y2="${H - Bm}" stroke="#E2D7CC"/>${bars}${labs}</svg></div>`;
}

/* 5.2 近 4 周走势：滚动 7 天窗口，假期周单独标灰，不让它污染趋势判断 */
function weekWindows(n = 4) {
  const ds = cur().daily.map(x => x.d).sort();
  const out = [];
  let end = ds[ds.length - 1];
  for (let i = 0; i < n; i++) {
    const start = addDays(end, -6);
    const list = ds.filter(d => d >= start && d <= end);
    if (!list.length) break;
    const days = cur().daily.filter(x => list.indexOf(x.d) >= 0);
    const hol = days.filter(x => isHol(x.d)).length;
    out.unshift({ a: start, b: end, days: days.length, hol, agg: agg(days) });
    end = addDays(start, -1);
  }
  return out;

/* 跨月时最想知道的是「这个月比上个月好在哪」。
   月有长短，比总额会被天数骗，所以环比一律用**日均实收**比。 */
function monthBlock() {
  const s = cur();
  const ms = monthRanges();
  if (ms.length < 2) return '';
  const by = {};
  s.daily.forEach(d => {
    const k = d.d.slice(0, 7);
    const o = by[k] || (by[k] = { net: 0, gross: 0, disc: 0, comm: 0, orders: 0, days: 0 });
    o.net += d.net; o.gross += d.gross; o.disc += d.disc; o.comm += d.comm; o.orders += d.orders; o.days++;
  });
  const keys = Object.keys(by).sort();
  if (keys.length < 2) return '';
  const rows = keys.map((k, i) => {
    const o = by[k], pv = i ? by[keys[i - 1]] : null;
    const netD = o.net / o.days;
    const mom = pv ? netD / (pv.net / pv.days) - 1 : null;
    const calDays = new Date(Number(k.slice(0, 4)), Number(k.slice(5, 7)), 0).getDate();
    const partial = o.days < calDays;
    const m = ms.filter(x => x.key === k)[0];
    return `<tr${m ? ` data-act="wkGo" data-a="${m.a}" data-b="${m.b}" style="cursor:pointer"` : ''}>
      <td><b>${Number(k.slice(5, 7))} 月</b>${partial ? `<span class="chip gray" style="margin-left:6px;font-size:10px">只覆盖 ${o.days} 天</span>` : ''}</td>
      <td class="r num">${o.days}</td>
      <td class="r num">${money(o.net)}</td>
      <td class="r num">${money2(netD)}</td>
      <td class="r num" style="color:${mom == null ? 'var(--ink3)' : mom >= 0 ? 'var(--pos)' : 'var(--neg)'};font-weight:600">${mom == null ? '—' : spct(mom)}</td>
      <td class="r num">${nf(o.orders)}</td>
      <td class="r num">${money2(o.orders ? o.net / o.orders : 0)}</td>
      <td class="r num">${pct(div(o.net, o.gross))}</td>
      <td class="r num">${pct(div(o.disc, o.gross))}</td>
    </tr>`;
  }).join('');
  const last = keys[keys.length - 1], pv = by[keys[keys.length - 2]];
  const momTxt = (by[last].net / by[last].days) / (pv.net / pv.days) - 1;
  return `<div class="sec"><h2>按月看</h2><p>自然月汇总；环比按日均比，月长不同也不会被天数带偏</p></div>
    <div class="card scroll">
      <table>
        <thead><tr><th>月份</th><th class="r">天数</th><th class="r">实收</th><th class="r">日均实收</th><th class="r">环比（日均）</th><th class="r">单量</th><th class="r">单均</th><th class="r">到手率</th><th class="r">优惠率</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="note" style="margin-top:10px">${Number(last.slice(5, 7))} 月日均比 ${Number(keys[keys.length - 2].slice(5, 7))} 月${momTxt >= 0 ? '高' : '低'} <b>${pct(Math.abs(momTxt))}</b>。点任意一行，可以把那一整月拉到上面做归因。</div>`;
}

/* 5.3 让利杠杆：多让的优惠有没有换回等值的实收 —— 判断一波活动值不值，只看这个比值 */
function leverage(c) {
  const A = c.A, B = c.B;
  if (!A || !B || !A.gross || !B.gross) return null;
  const dNet = A.net - B.net * c.scale;
  const dDisc = A.disc - B.disc * c.scale;
  const dGross = A.gross - B.gross * c.scale;
  if (Math.abs(dDisc) < Math.max(120, Math.abs(B.disc) * 0.06)) return null; // 优惠没明显动，不谈杠杆
  const ratio = dDisc > 0 ? dNet / dDisc : null;
  const lv = ratio == null ? 'flat'
    : ratio >= 1.5 ? 'good' : ratio >= 1 ? 'flat' : ratio >= 0 ? 'warn' : 'bad';
  const verdict = {
    good: '划算：让出去的钱成倍收回',
    flat: '勉强打平：让多少收多少，白忙',
    warn: '不划算：让出去 1 元，收不回 1 元',
    bad: '反效果：让得更多，收得更少',
    flat2: ''
  }[lv];
  return { dNet, dDisc, dGross, ratio, lv, verdict };
}
/* 6.6 优惠明细：把「优惠」拆成 9 项，找出是哪一项在动

const isCommFee = (n) => /佣金|服务费/.test(n);

  '美团外卖服务费/佣金': '美团·佣金',
  '淘宝闪购·餐饮服务费/佣金': '淘宝闪购·佣金',
  '淘宝闪购·餐饮商家优惠': '淘宝闪购·优惠',
  '美团商家优惠': '美团·优惠',
  '系统优惠券': '系统优惠券',
  '手动抹零': '手动抹零',
  '仅退款优惠': '仅退款',
  '会员赠送卡值': '会员赠送',

  const names = Array.from(new Set([...Object.keys(a), ...Object.keys(b)]));
  const rows = names.map(n => {
    const va = a[n] || 0, vbRaw = b[n] || 0, vb = vbRaw * k;
    return {
      name: n, a: va, b: vbRaw, d: va - vb, comm: isCommFee(n),
      rate: vb > 1 ? va / vb - 1 : null

  }).sort((x, y) => Math.abs(y.d) - Math.abs(x.d));
  const totA = rows.reduce((t, r) => t + r.a, 0);

/* 自有让利率的逐日曲线：哪一天开始变的，一眼能看出来

function discCurve() {
  const s = cur(), dd = s.discDaily || {};
  return s.daily.map(x => {
    const d = dd[x.d] || {};
    let own = 0;
    for (const n in d) if (!isCommFee(n)) own += d[n];

  const n = curve.length;

  const mean = (a) => a.length ? a.reduce((t, r) => t + r.rate, 0) / a.length : 0;

  for (let i = 4; i <= n - 2; i++) {

  return { pre: best.pre, start: curve[best.i].d, post: best.post, idx: best.i };
}

    if (i % 5 === 0) labs += `<text x="${bx + bw / 2}" y="${H - 7}" text-anchor="middle" font-size="10" fill="#A2958C">${Number(r.d.slice(5, 7))}/${Number(r.d.slice(8))}</text>`;
  });

      <text x="${L + 3}" y="${y(br.pre) - 5}" text-anchor="start" font-size="10" fill="#8C7F75">之前均值 ${pct(br.pre)}</text>`;

      : `多让的 <b>${money(sp.totD)}</b> 里，<b>${money(top.d)}</b>（${pct(div(top.d, sp.totD))}）来自<b>「${esc(top.name)}」</b>，其余 ${restN} 项合计只有 ${sm(restD)}。`)

      <div><span class="dot" style="background:#8E2F24"></span>平台佣金（刚性）<b>${sm(commD)}</b></div>
